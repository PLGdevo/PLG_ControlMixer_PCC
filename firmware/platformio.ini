; ESP32-S3 dùng Arduino core 3.x (qua pioarduino)
[env:esp32-s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; giải mã backtrace khi crash thành tên hàm + dòng; hiện chữ đang gõ
monitor_filters = esp32_exception_decoder
monitor_echo = yes
; Serial = cổng USB gốc, Serial0 = cổng CH343; log ghi ra cả hai (src/debug.cpp)
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
