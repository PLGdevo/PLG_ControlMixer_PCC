<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RC Controller Preview</title>
<!-- Bản xem trước app Flutter (app/lib) — chạy thẳng trong trình duyệt, dữ liệu giả lập, không kết nối xe thật.
     Logic được port từ: models/*, services/mix_engine.dart, layout/*, screens/*. Sửa app thì sửa cả file này. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --page: #0e0e0e; --page-text: #e6e6e6; --page-muted: #98989a; --page-line: #2a2a2a;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) { --page: #eef0ea; --page-text: #191919; --page-muted: #59595a; --page-line: #d6d6d6; }
}
:root[data-theme="light"] { --page: #eef0ea; --page-text: #191919; --page-muted: #59595a; --page-line: #d6d6d6; }
:root[data-theme="dark"] { --page: #0e0e0e; --page-text: #e6e6e6; --page-muted: #98989a; --page-line: #2a2a2a; }

/* Token app — lấy từ app/lib/theme/tokens.dart */
.device[data-t="dark"] {
  --bg:#191919; --surface:#262626; --surface2:#333333; --line:#333333;
  --text:#ffffff; --textBody:#e6e6e6; --textMuted:#98989a; --disabled:#59595a;
  --accent:#9EFF00; --accentFill:#9EFF00; --accentFillPressed:#B1FF33; --onAccentFill:#191919;
  --accentContainer:rgba(158,255,0,.12); --onAccentContainer:#C5FF66;
  --ok:#4CAF50; --warn:#FFC107; --bad:#F44336; --idle:#98989a;
}
.device[data-t="light"] {
  --bg:#FDFFFA; --surface:#ffffff; --surface2:#F9FFF0; --line:#E6E6E6;
  --text:#191919; --textBody:#4C4C4D; --textMuted:#59595A; --disabled:#98989A;
  --accent:#3D6600; --accentFill:#9EFF00; --accentFillPressed:#B1FF33; --onAccentFill:#191919;
  --accentContainer:#ECFFCC; --onAccentContainer:#191919;
  --ok:#2E7D32; --warn:#B26A00; --bad:#C62828; --idle:#59595A;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--page); color: var(--page-text); font-family: Barlow, system-ui, sans-serif; overflow: hidden; }
button { font-family: inherit; }

/* ---------- Khung trang ---------- */
.shell { display: flex; flex-direction: column; height: 100%; }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--page-line); }
.toolbar h1 { font-size: 16px; font-weight: 700; margin: 0 12px 0 0; }
.toolbar .grp { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
.toolbar .sep { width: 1px; height: 24px; background: var(--page-line); margin: 0 4px; }
.tb { background: transparent; color: var(--page-text); border: 1px solid var(--page-line); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 500; cursor: pointer; }
.tb.on { background: #9EFF00; color: #191919; border-color: #9EFF00; }
.tb:hover:not(.on) { border-color: var(--page-muted); }
.toolbar label { font-size: 13px; color: var(--page-muted); display: flex; gap: 6px; align-items: center; cursor: pointer; }
.hint { font-size: 12px; color: var(--page-muted); margin-left: auto; }
.stage { flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
.frame { border-radius: 36px; padding: 10px; background: #050505; box-shadow: 0 0 0 1px #333, 0 20px 60px rgba(0,0,0,.45); transform-origin: center; }

/* ---------- Thiết bị ---------- */
.device { position: relative; overflow: hidden; border-radius: 28px; background: var(--bg); color: var(--text);
  font-family: Barlow, system-ui, sans-serif; font-size: 15px; font-variant-numeric: tabular-nums; }
.device.portrait { width: 390px; height: 800px; }
.device.landscape { width: 820px; height: 380px; }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; }
.device svg.ic { width: 24px; height: 24px; flex: none; }
.device svg.ic.mini { width: 20px; height: 20px; }

.appbar { height: 56px; flex: none; display: flex; align-items: center; gap: 4px; padding: 0 4px 0 8px; background: var(--surface); border-bottom: 1px solid var(--line); }
.appbar .title { font-size: 18px; font-weight: 600; flex: 1; padding-left: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.iconbtn { width: 48px; height: 48px; border-radius: 999px; border: 0; background: transparent; color: var(--text); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; flex: none; }
.iconbtn:hover { background: color-mix(in srgb, var(--text) 8%, transparent); }
.iconbtn:disabled { color: var(--disabled); cursor: default; background: transparent; }
.iconbtn.outlined { width: 40px; height: 40px; border: 1px solid var(--line); }
.body { flex: 1; overflow-y: auto; padding: 16px; }
.body::-webkit-scrollbar { width: 0; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 20px; border-radius: 999px;
  font-size: 14px; font-weight: 500; cursor: pointer; border: 1px solid transparent; white-space: nowrap; }
.btn.filled { background: var(--accentFill); color: var(--onAccentFill); }
.btn.filled:hover { background: var(--accentFillPressed); }
.btn.filled:disabled { background: var(--surface2); color: var(--disabled); cursor: default; }
.btn.outlined { background: transparent; color: var(--text); border-color: var(--line); padding: 0 18px; }
.btn.outlined:hover { background: color-mix(in srgb, var(--text) 6%, transparent); }
.btn.outlined:disabled { color: var(--disabled); cursor: default; background: transparent; }
.btn.text { background: transparent; color: var(--accent); padding: 0 12px; }
.btn.text:hover { background: var(--accentContainer); }
.btn.text:disabled { color: var(--disabled); cursor: default; background: transparent; }
.btn.small { min-height: 36px; padding: 0 12px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; margin: 4px 0; }
.card.sel { border-color: var(--accent); }
.caption { font-size: 12px; font-weight: 500; letter-spacing: .96px; color: var(--textMuted); }
.muted { color: var(--textMuted); }
.lbl { font-size: 14px; font-weight: 500; }
.h-title { font-size: 18px; font-weight: 600; }

.pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; border: 1px solid currentColor; font-size: 14px; font-weight: 600; white-space: nowrap; }
.pill .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }

.spinner { width: 16px; height: 16px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.fab { position: absolute; right: 16px; bottom: 16px; height: 56px; padding: 0 20px 0 16px; border-radius: 999px; border: 0; background: var(--accentFill); color: var(--onAccentFill);
  display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; cursor: pointer; }

/* Ô nhập */
.field { position: relative; margin-bottom: 4px; }
.field input, .field select { width: 100%; height: 56px; padding: 22px 14px 6px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface2); color: var(--text);
  font: 400 15px Barlow, system-ui, sans-serif; outline: none; }
.field select { cursor: pointer; }
.field input:focus, .field select:focus { border: 1.5px solid var(--accent); }
.field label { position: absolute; left: 15px; top: 8px; font-size: 12px; color: var(--textMuted); pointer-events: none; }
.field input:focus + label { color: var(--accent); }
.field.err input { border-color: var(--bad); }
.field .errtxt { color: var(--bad); font-size: 12px; font-weight: 500; padding: 4px 14px 0; }
.field .count { text-align: right; font-size: 12px; color: var(--textMuted); padding: 4px 4px 0; }
.field.dense input, .field.dense select { height: 48px; padding-top: 18px; }
.field.dense label { top: 5px; }
.tin { width: 100%; height: 44px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface2); color: var(--text); font: 400 15px Barlow, system-ui, sans-serif; outline: none; }
.tin:focus { border: 1.5px solid var(--accent); }

.seg { display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.seg button { flex: 1; height: 40px; border: 0; background: transparent; color: var(--text); font-size: 14px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; padding: 0 4px; white-space: nowrap; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on { background: var(--accentContainer); color: var(--onAccentContainer); }
.seg.sm button { height: 34px; font-size: 13px; }

.switch { width: 52px; height: 32px; border-radius: 999px; background: var(--surface2); border: 2px solid var(--line); position: relative; cursor: pointer; flex: none; }
.switch::after { content: ""; position: absolute; left: 4px; top: 4px; width: 20px; height: 20px; border-radius: 50%; background: var(--textMuted); transition: .15s; }
.switch.on { background: var(--accentFill); border-color: var(--accentFill); }
.switch.on::after { left: 24px; width: 24px; height: 24px; top: 2px; background: var(--onAccentFill); }
.switch.dis { opacity: .4; cursor: default; }

.chip { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--text); font: 500 14px Barlow, system-ui, sans-serif; cursor: pointer; }
.chip.on { background: var(--accentContainer); color: var(--onAccentContainer); border-color: transparent; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }

input[type=range] { width: 100%; accent-color: var(--accentFill); margin: 6px 0; cursor: pointer; }
input[type=range]:disabled { cursor: default; opacity: .4; }

.numfield { display: flex; align-items: center; gap: 8px; padding: 6px 0; }
.numfield .nl { flex: 1; }
.numfield .nv { min-width: 96px; text-align: center; height: 44px; line-height: 44px; border-radius: 12px; background: var(--surface2); border: 1px solid var(--line); font-weight: 600; }
.numfield.err .nv { border-color: var(--bad); color: var(--bad); }
.numerr { color: var(--bad); font-size: 12px; font-weight: 500; margin-top: -2px; margin-bottom: 4px; }
.divider { height: 1px; background: var(--line); margin: 12px 0; }
.srow { display: flex; align-items: center; gap: 12px; padding: 8px 0; }
.srow .st { flex: 1; }
.srow .st small { display: block; color: var(--textMuted); font-size: 13px; }

.tabs { display: flex; gap: 4px; padding: 0 12px 8px; background: var(--surface); border-bottom: 1px solid var(--line); overflow-x: auto; flex: none; }
.tabs button { height: 40px; padding: 0 18px; border: 0; border-radius: 999px; background: transparent; color: var(--textMuted); font-size: 14px; font-weight: 500; cursor: pointer; }
.tabs button.on { background: var(--accentFill); color: var(--onAccentFill); }
.bottombar { flex: none; background: var(--surface); border-top: 1px solid var(--line); padding: 8px 12px 12px; }

.radio { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--textMuted); flex: none; position: relative; }
.radio.on { border-color: var(--accent); }
.radio.on::after { content: ""; position: absolute; inset: 3px; border-radius: 50%; background: var(--accent); }

/* Menu, hộp thoại, snackbar */
.scrim { position: absolute; inset: 0; z-index: 40; }
.scrim.dim { background: rgba(0,0,0,.5); display: flex; align-items: center; justify-content: center; }
.menu { position: absolute; background: var(--surface2); border-radius: 12px; padding: 6px 0; min-width: 200px; box-shadow: 0 8px 24px rgba(0,0,0,.35); z-index: 41; }
.menu .mi { display: flex; align-items: center; gap: 16px; padding: 10px 16px; cursor: pointer; color: var(--text); }
.menu .mi:hover { background: color-mix(in srgb, var(--text) 8%, transparent); }
.menu .mi.dis { color: var(--disabled); cursor: default; background: transparent; }
.menu .mi .ic { color: var(--textMuted); }
.menu .mi small { display: block; color: var(--textMuted); font-size: 13px; }
.menu .mi.chk { color: var(--accent); }
.dialog { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 24px; width: min(340px, 86%); }
.dialog h3 { margin: 0 0 12px; font-size: 18px; font-weight: 600; }
.dialog p { margin: 0 0 20px; color: var(--textBody); }
.dialog .acts { display: flex; justify-content: flex-end; gap: 8px; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); border-radius: 16px 16px 0 0; padding: 8px 16px 16px; max-height: 80%; overflow-y: auto; z-index: 41; }
.sheet .handle { width: 32px; height: 4px; border-radius: 2px; background: var(--textMuted); margin: 8px auto 16px; opacity: .5; }
.sheet .row { display: flex; align-items: center; gap: 16px; padding: 12px 4px; cursor: pointer; border-radius: 12px; }
.sheet .row:hover { background: var(--surface2); }
.snack { position: absolute; left: 12px; right: 12px; bottom: 12px; background: var(--surface2); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; color: var(--text);
  z-index: 60; transform: translateY(140%); transition: transform .2s; pointer-events: none; }
.snack.show { transform: none; }
.landscape .snack { left: 50%; right: auto; width: 420px; margin-left: -210px; }

/* ---------- Màn Lái ---------- */
.drive { padding: 4px 8px 8px; min-width: 0; }
.trash { min-width: 0; overflow: hidden; }
.trash span { overflow: hidden; text-overflow: ellipsis; }
.drivebar { height: 48px; display: flex; align-items: center; gap: 4px; flex: none; }
.alarm { display: inline-flex; align-items: center; gap: 8px; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--bad); color: var(--bad);
  background: color-mix(in srgb, var(--bad) 18%, transparent); font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; max-width: 100%; }
.canvas { position: relative; flex: 1; margin-top: 4px; touch-action: none; user-select: none; }
.canvas.editing { background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size: calc(100% / 24) calc(100% / 12); outline: 1px dashed var(--line); border-radius: 4px; }
.item { position: absolute; padding: 3px; }
.item > .in { width: 100%; height: 100%; }
.canvas.editing .item > .in { pointer-events: none; }
.canvas.editing .item { cursor: grab; }
.canvas.editing .item.sel > .in { outline: 2px solid var(--accent); border-radius: 16px; }
.canvas.editing .item .rz { position: absolute; right: 0; bottom: 0; width: 18px; height: 18px; border-radius: 50%; background: var(--accentFill); border: 3px solid var(--bg); cursor: nwse-resize; display: none; }
.canvas.editing .item.sel .rz { display: block; }
#guides { position: absolute; inset: 0; pointer-events: none; }
#guides .gl { position: absolute; background: var(--accent); opacity: .7; }
.frameitem { height: 100%; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 8px; }
.frameitem .hd { display: flex; align-items: center; gap: 4px; padding-bottom: 4px; }
.frameitem .hd .caption { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-transform: uppercase; }
.frameitem .hd .val { font-size: 12px; font-weight: 500; letter-spacing: .96px; color: var(--text); white-space: nowrap; }
.frameitem .ct { flex: 1; position: relative; min-height: 0; }
.axis { position: absolute; inset: 0; background: var(--surface2); cursor: pointer; touch-action: none; }
.axis.pv { position: relative; height: 44px; margin-top: 4px; }
.axis .cl { position: absolute; background: var(--line); }
.axis .bar { position: absolute; background: color-mix(in srgb, var(--accentFill) 35%, transparent); border-radius: 999px; }
.axis .th { position: absolute; border-radius: 50%; background: var(--accentFill); }
.axis .th::after { content: ""; position: absolute; inset: 32%; border-radius: 50%; border: 1.5px solid color-mix(in srgb, var(--onAccentFill) 25%, transparent); }
.s2 { position: absolute; inset: 0; cursor: pointer; touch-action: none; }
.s2 .b2 { position: absolute; border-radius: 50%; background: var(--surface2); }
.s2 .h2, .s2 .v2 { position: absolute; background: var(--line); }
.s2 .k2 { position: absolute; border-radius: 50%; background: var(--accentFill); }
.knob { position: absolute; inset: 0; cursor: ns-resize; touch-action: none; }
.sw3 { display: flex; height: 100%; max-height: 44px; background: var(--surface2); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.sw3 button { flex: 1; border: 0; border-radius: 999px; background: transparent; color: var(--textMuted); font-size: 14px; cursor: pointer; }
.sw3 button.on { background: var(--accentFill); color: var(--onAccentFill); }
.chbtn { height: 100%; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); color: var(--text); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer; transition: background .09s; overflow: hidden; }
.chbtn.on { background: var(--accentFill); border-color: var(--accentFill); color: var(--onAccentFill); }
.chbtn .lbl { font-weight: 600; }
.chbtn .caption { font-size: 11px; }
.chbtn.on .caption { color: var(--onAccentFill); }
.gauge { height: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 4px 8px; }
.gauge { overflow: hidden; white-space: nowrap; }
.gauge .gh { display: flex; align-items: center; gap: 4px; color: var(--textMuted); }
.gauge .gh svg { width: 14px; height: 14px; }
.gauge .gv { font-size: 18px; font-weight: 700; }
.gauge .gs { font-size: 11px; color: var(--textMuted); }
.rowctl { display: flex; align-items: center; gap: 4px; height: 100%; }
.rowctl .mid { flex: 1; text-align: center; min-width: 0; }
.panel { width: 340px; flex: none; background: var(--surface); border-left: 1px solid var(--line); display: flex; flex-direction: column; }
.panel .body { padding: 8px 16px 24px; }
.trash.hot { border-color: var(--bad) !important; color: var(--bad) !important; }
.trash.over { background: color-mix(in srgb, var(--bad) 25%, transparent); }

/* Mix */
.mixcard.dropto { box-shadow: 0 -3px 0 var(--accent); }
.mixcols { display: flex; justify-content: center; gap: 32px; height: 140px; margin-top: 12px; }
.mixcol { width: 96px; display: flex; flex-direction: column; align-items: center; }
.mixcol .mv { font-size: 18px; font-weight: 700; }
.mixcol .tube { flex: 1; width: 36px; margin: 4px 0; border-radius: 12px; background: var(--surface2); border: 1px solid var(--line); position: relative; overflow: hidden; }
.mixcol .tube.act { border-color: var(--accent); }
.mixcol .fillv { position: absolute; left: 4px; right: 4px; background: var(--accentFill); border-radius: 4px; }
.mixcol .zero { position: absolute; left: 0; right: 0; height: 1px; top: 50%; background: var(--line); }
.band { position: relative; height: 28px; margin: 0 24px; }
.band .tr { position: absolute; left: 0; right: 0; top: 10px; bottom: 10px; border-radius: 999px; background: var(--surface2); }
.band .zone { position: absolute; top: 6px; bottom: 6px; border-radius: 4px; background: color-mix(in srgb, var(--warn) 30%, transparent); }
.band .cur { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--accent); }
.metrics { display: flex; justify-content: space-around; text-align: center; }
.metrics .v { font-size: 18px; font-weight: 700; }
</style>
</head>
<body>
<div class="shell">
  <div class="toolbar">
    <h1>RC Controller · xem trước</h1>
    <div class="grp" id="nav"></div>
    <div class="sep"></div>
    <div class="grp">
      <button class="tb" id="themeBtn"></button>
      <label><input type="checkbox" id="simFail"> Giả lập failsafe</label>
      <label><input type="checkbox" id="simLost"> Mất tín hiệu</label>
      <label><input type="checkbox" id="simEmpty"> Garage trống</label>
    </div>
    <span class="hint">Màn Lái: W/S = ga · A/D = lái · kéo cần bằng chuột · núm xoay: kéo dọc, nháy đúp về 0</span>
  </div>
  <div class="stage" id="stage">
    <div class="frame" id="frame"><div class="device portrait" id="device" data-t="dark"><div class="screen" id="screen"></div><div class="snack" id="snack"></div></div></div>
  </div>
</div>

<script>
// ============================================================================
//  Icon — Heroicons v2 outline + 4 icon tự vẽ (assets/icons)
// ============================================================================
const P = {
  back: 'M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18',
  plus: 'M12 4.5v15m7.5-7.5h-15',
  minus: 'M5 12h14',
  connect: 'M13.19 8.688a4.5 4.5 0 0 1 1.242 7.244l-4.5 4.5a4.5 4.5 0 0 1-6.364-6.364l1.757-1.757m13.35-.622 1.757-1.757a4.5 4.5 0 0 0-6.364-6.364l-4.5 4.5a4.5 4.5 0 0 0 1.242 7.244',

/** CarController.syncProfile: app là nguồn đúng (0.5) — ghi cấu hình hồ sơ xuống xe nếu khác cấu hình xe đang có.
 *  Firmware v1 phải nhận cả CH1/CH2; Sprint 4 chỉ còn FS_WRITE. Trả về true nếu đã ghi. */
function syncProfile(p, force = false) {
  const want = carConfigOf(p);
  if (!force && JSON.stringify(S.carCfg[p.id]) === JSON.stringify(want)) return false;
  S.carCfg[p.id] = want;
  return true;
}

let snackTimer;

const actions = {}, INP = {}, RG = {};
let actSeq = 0;

function openMenu(ev, items) {

const pill = (c, l) => `<span class="pill" style="color:${c};background:color-mix(in srgb, ${c} 14%, transparent)"><span class="dot"></span>${esc(l)}</span>`;
function statusPill(state) {

const hint = (s) => `<div class="muted" style="font-size:13px;font-weight:500;margin-bottom:12px;white-space:pre-line">${esc(s)}</div>`;
/** Ô nhập có nhãn nổi; `on(v)` được gọi mỗi lần gõ */
function field(label, value, o = {}) {
  const { fid, err, max, hint: ph, on, type } = o;
  return `<div class="field${err ? ' err' : ''}"><input data-in="${I(on)}" data-fid="${fid}" value="${esc(value)}" ${max ? `maxlength="${max}"` : ''} ${type ? `inputmode="${type}"` : ''} placeholder="${esc(ph || ' ')}"><label>${esc(label)}</label>
    ${err ? `<div class="errtxt">${esc(err)}</div>` : ''}${max ? `<div class="count">${String(value).length}/${max}</div>` : ''}</div>`;
}
function selectField(label, value, options, on, dense) {
  const has = options.some(([v]) => v === value);
  return `<div class="field${dense ? ' dense' : ''}"><select data-sel="${I(on)}">${has ? '' : '<option value="" selected disabled>— Chọn —</option>'}${options.map(([v, l]) => `<option value="${esc(v)}" ${v === value ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select><label>${esc(label)}</label></div>`;
}
/** NumberField: −/+ theo bước, giữ lâu đổi gấp 10 lần */
function numField(label, value, o, set) {
  const { min, max, step = 1, unit = '', err } = o;
  const put = (v) => set(clamp(v, min, max));
  return `<div class="numfield${err ? ' err' : ''}"><div class="nl">${esc(label)}</div>
    <button class="iconbtn outlined" ${value <= min ? 'disabled' : ''} data-act="${A(() => put(value - step))}" data-lp="${A(() => put(value - step * 10))}">${ic('minus', { mini: true })}</button>
    <div class="nv">${value}${unit}</div>
    <button class="iconbtn outlined" ${value >= max ? 'disabled' : ''} data-act="${A(() => put(value + step))}" data-lp="${A(() => put(value + step * 10))}">${ic('plus', { mini: true })}</button></div>
    ${err ? `<div class="numerr">${esc(err)}</div>` : ''}`;
}
function switchRow(label, on, fn, o = {}) {
  return `<div class="srow"><div class="st"${o.disabled ? ' style="color:var(--disabled)"' : ''}>${esc(label)}${o.sub ? `<small>${esc(o.sub)}</small>` : ''}</div>
    <div class="switch${on ? ' on' : ''}${o.disabled ? ' dis' : ''}" ${o.disabled ? '' : `data-act="${A(fn)}"`} data-stop="1"></div></div>`;
}
const segs = (opts, val, fn, cls = '') => `<div class="seg ${cls}">${opts.map(([k, l]) => `<button class="${val === k ? 'on' : ''}" data-act="${A(() => fn(k))}">${l}</button>`).join('')}</div>`;
const chip = (label, on, fn) => `<button class="chip${on ? ' on' : ''}" data-act="${A(fn)}">${label}</button>`;
/** Thanh trượt: `label(v)` hiển thị phía trên, cập nhật khi kéo mà không vẽ lại cả màn */
function slider({ min, max, step = 1, value, label, start, set, after, disabled, capLabel }) {
  const k = R({ start, set, label, after });
  const lab = label ? `<div data-rgl="${k}" class="${capLabel ? 'caption' : 'lbl'}" style="margin-top:${capLabel ? 16 : 8}px">${esc(label(value))}</div>` : '';
  return `${lab}<input type="range" min="${min}" max="${max}" step="${step}" value="${value}" data-rg="${k}" ${disabled ? 'disabled' : ''}>`;
}

function lastConnected(p) {
  if (!p.lastConnectedAt) return 'Chưa kết nối lần nào';
  const d = new Date(p.lastConnectedAt), two = (n) => String(n).padStart(2, '0');
  return `Kết nối lần cuối ${two(d.getDate())}/${two(d.getMonth() + 1)} ${two(d.getHours())}:${two(d.getMinutes())}`;
}
/** QuickPing giả lập: WiFi trả lời nếu 192.168.4.1:4210, BLE trả lời nếu đúng MAC xe mẫu */
function quickPing(conn, ip, port, mac, done) {
  setTimeout(() => {
    if (conn === 'ble' && !mac) return done({ ok: false, label: '✗ Chưa có MAC' });
    if (conn === 'wifi' && !isIpv4(ip)) return done({ ok: false, label: '✗ IP không hợp lệ' });
    const ok = conn === 'wifi' ? ip === '192.168.4.1' && +port === 4210 : mac.toUpperCase() === DEMO_BLE;
    done(ok ? { ok, label: `✓ ${8 + Math.round(Math.random() * 12)} ms` } : { ok, label: '✗ Không phản hồi' });
  }, 800);
}
function connect(p) {
  if (p.conn === 'ble' && !p.ble.mac) { snack('Hồ sơ chưa có MAC. Bấm Sửa để chọn xe BLE.'); return; }
  if (S.connectedId) disconnect();
  S.connectingId = p.id; S.connectedId = p.id; S.link = 'connecting';
  setTimeout(() => {
    S.connectingId = null;
    const ok = p.conn === 'wifi' ? p.wifi.ip === '192.168.4.1' && p.wifi.port === 4210 : p.ble.mac.toUpperCase() === DEMO_BLE;
    if (!ok) { S.connectedId = null; S.link = 'disconnected'; render(); snack('Kết nối thất bại: xe không trả lời cấu hình'); return; }
    S.link = document.getElementById('simLost').checked ? 'lost' : 'connected';
    S.gear = 1; S.values.fill(0);
    p.lastConnectedAt = Date.now();
    syncProfile(p); // Không có bước "đọc từ xe": hồ sơ trong app luôn được đưa xuống xe (E6)
    openControl(p.id);
  }, 900);
}
function disconnect() { S.connectedId = null; S.link = 'disconnected'; S.tel = null; S.values[0] = S.values[1] = 0; }
function testPing(p) {
  S.pinging[p.id] = true; delete S.ping[p.id];
  quickPing(p.conn, p.wifi.ip, p.wifi.port, p.ble.mac, (r) => { delete S.pinging[p.id]; S.ping[p.id] = r; render(); });
}
function exportProfile(p) {
  const safe = p.name.replace(/[^\p{L}\p{N}_-]+/gu, '_');
  const url = URL.createObjectURL(new Blob([JSON.stringify(p, null, 2)], { type: 'application/json' }));
  const a = document.createElement('a');
  a.href = url; a.download = `${safe}.json`; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  snack(`Đã xuất: exports/${safe}.json`);
}

function finishWizard() {

function pickControl(d, c) {
  const l = d.layout, isMain = c.index <= 2;

    if (!bound) return;
    if (isMain) { snack('Kênh Ga/Lái luôn cần một phần tử trên màn Lái. Hãy chọn phần tử khác thay vì bỏ gán.'); return; }
    unassignChannel(l, c.index);
  };
  const pickSlot = (it, y) => {
    const cur = y ? it.channelY : it.channel;

    const assign = () => { assignChannel(l, it, c.index, y); c.enabled = true; };

    confirmDlg('Phần tử đang được dùng', `${slotName(it, y)} đang gán ${short(cur)}. Thay bằng ${chLabel(c)}? ${short(cur)} sẽ thành chưa gán.`, 'Thay', () => {

  };
  const create = (k) => {

  };
  const slots = l.items.filter((i) => isControl(i.kind)).flatMap((i) => i.kind === 'stick2D' ? [[i, false], [i, true]] : [[i, false]]);

function openMix(idx) {

  if (idx == null && d.mixes.length >= MAX_MIX) { snack(`Tối đa ${MAX_MIX} luật mix`); return; }
  const rule = idx == null ? newMix() : clone(d.mixes[idx]);
  S.mixEdit = { idx, rule, engine: new MixEngine([rule]), src: 0, gate: true, select: false, lastType: null, out: new Array(10).fill(0) };
  go('mix');
}
function mixError() {
  const r = S.mixEdit.rule, e = mixValidate(r);
  if (e) return e;
  const others = S.settings.draft.mixes.filter((x) => x.id !== r.id);
  const cyc = findCycle([...others, r].filter((x) => x.enabled));
  return cyc ? `Tạo vòng lặp: ${cyc.map((c) => 'CH' + c).join(' → ')}` : null;
}
function mixRun() {
  const m = S.mixEdit, r = m.rule;
  if (m.lastType !== r.type) { m.engine.reset(); m.lastType = r.type; }
  m.engine.rules = [r];
  if (mixValidate(r)) return;

  input[r.src - 1] = m.src;
  if (r.type === 'select') input[r.sel - 1] = m.select ? 100 : -100;

}
function mixPvTop() {

  if (r.type === 'threshold') {
    const x = (p) => (p + 100) / 2;
    h += `<div class="band" style="margin-top:8px"><div class="tr"></div><div class="zone" style="left:${x(r.offBelow)}%;width:max(2px, ${x(r.onAt) - x(r.offBelow)}%)"></div><div class="cur" style="left:calc(${x(m.src)}% - 1px)"></div></div>
      <div class="caption" style="text-align:center;letter-spacing:0">Vùng giữ trạng thái ${Math.round(r.offBelow)}–${Math.round(r.onAt)}%</div>`;

}
function mixPvBottom() {

  const nm = (ch) => { const c = chs[ch - 1]; return c.name === `Kênh ${ch}` ? `CH${ch}` : `CH${ch} ${c.name}`; };
  const sel = r.type === 'select' ? m.engine.selectState(r.id) : null;

      <div class="caption" style="letter-spacing:0;color:${active ? 'var(--accent)' : 'var(--textMuted)'};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:96px">${esc(nm(ch))}</div></div>`;
  };

function renderMix() {

      <button class="btn filled" ${err ? 'disabled' : ''} data-act="${A(done)}">Xong</button></div>`;

// ============================================================================

const ctlProfile = () => S.ctl && prof(S.ctl.pid);
const ctlLayout = () => S.ctl && (S.ctl.editing ? S.ctl.draft : ctlProfile()?.layout);
const switchPct = (cfg, kind, pos) => kind === 'switch3' ? [cfg.offPct, 0, 100][pos] : pos === 1 ? 100 : cfg.offPct;

function openControl(pid) {
  const p = prof(pid);
  S.ctl = { pid, editing: false, draft: null, sel: null, undo: [], redo: [], chSnap: null };
  if (S.gear > p.gears.count) S.gear = p.gears.count;
  initValues();
  go('control');
}
/** _initValues: vị trí ban đầu khi vào màn (H3b) và trạng thái nút/công tắc */
function initValues() {
  const p = ctlProfile();
  for (const it of p.layout.items) {
    const ch = it.channel;
    if (ch == null) continue;
    const cfg = p.channels[ch - 1];
    if (isStickK(it.kind)) {
      S.values[ch - 1] = RM.initial(it.ret || newRet(), it.saved) / 100;
      if (it.kind === 'stick2D' && it.channelY != null) S.values[it.channelY - 1] = RM.initial(it.retY || newRet(), it.savedY) / 100;
    } else if (it.kind === 'button') { S.sw[ch] = 0; S.values[ch - 1] = cfg.offPct / 100; }
    else if (it.kind === 'toggle' || it.kind === 'switch3') S.values[ch - 1] = switchPct(cfg, it.kind, S.sw[ch] || 0) / 100;
  }
  stopAxes();
}
/** _resetSticks: thoát màn / vào sửa bố cục → cần về vị trí thả; ga "Giữ vị trí" về Center */
function resetSticks(remember) {
  const p = ctlProfile();
  if (!p) return;
  for (const it of p.layout.items) {
    const axis = (ch, cfg, save) => {
      if (ch == null) return;
      const r = cfg || newRet();
      if (remember && r.mode === 'hold' && r.remember) save(S.values[ch - 1] * 100);
      S.values[ch - 1] = RM.onExit(r, ch === 2) / 100;
    };
    if (isStickK(it.kind)) {
      axis(it.channel, it.ret, (v) => { it.saved = v; });
      if (it.kind === 'stick2D') axis(it.channelY, it.retY, (v) => { it.savedY = v; });
    } else if (it.kind === 'button' && it.channel != null) {
      S.sw[it.channel] = 0; S.values[it.channel - 1] = p.channels[it.channel - 1].offPct / 100;
    }
  }
  stopAxes();
}
function leaveControl() {
  if (S.screen !== 'control' || !S.ctl) return;
  if (S.ctl.editing) cancelEdit();
  resetSticks(true);
}

function itemLabel(p, it) {
  if (!it.style.showLabel) return null;
  if (it.style.label && it.style.label.trim()) return it.style.label;
  if (it.channel != null) return p.channels[it.channel - 1].name;
  if (it.kind === 'gauge') return GAUGES[it.gauge];
  return KIND[it.kind];
}
function valText(p, it, ch) {
  const pct = S.values[ch - 1] * 100;
  if (it.style.valueDisplay === 'hidden') return null;
  return it.style.valueDisplay === 'us' ? `${pctToUs(p.channels[ch - 1], pct)} µs` : `${Math.round(pct)}%`;
}
function trailingText(p, it) {
  if (it.channel == null) return null;
  if (it.kind === 'stick2D') {
    const xs = valText(p, it, it.channel), ys = it.channelY == null ? null : valText(p, it, it.channelY);
    return xs == null ? null : `X ${xs}${ys == null ? '' : ' · Y ' + ys}`;

function frame(label, trailing, inner, style = '') {
  return `<div class="frameitem" style="${style}">${label != null || trailing != null ? `<div class="hd"><span class="caption">${esc(label ?? '')}</span>${trailing != null ? `<span class="val">${trailing}</span>` : ''}</div>` : ''}<div class="ct">${inner}</div></div>`;
}
function gaugeData(key) {
  const t = S.tel;
  switch (key) {
    case 'battery': return [t ? 'batteryHalf' : 'batteryEmpty', t ? `${t.v.toFixed(2)} V` : '--', null];
    case 'current': return ['current', t ? `${t.a.toFixed(1)} A` : '--', null];
    case 'speed': return ['speedometer', t ? `${t.kmh.toFixed(1)} km/h` : '--', null];
    // Ping ngầm khi lái (F6) thuộc Sprint 4 — như app: tạm hiện RSSI ở dòng phụ
    case 'ping': return ['signal', '--', t && t.rssi ? `RSSI ${t.rssi} dBm` : null];
    case 'rssi': return [t && t.rssi ? 'signal' : 'signalOff', t && t.rssi ? `${t.rssi} dBm` : '--', null];

// ---------- Trục cần gạt: vị trí thô, tự về (ReturnMotion), vùng chết ----------
const AXS = {};      // trạng thái bền: {raw, held, anim, kb}
let AXD = {};        // mô tả trục, dựng lại mỗi lần vẽ: {vertical, knob, dz, ret(), get(), set(out)}
const ax = (k) => (AXS[k] ||= { raw: 0, held: false, anim: null });
function regAxis(key, d) { AXD[key] = d; }
function chAxis(key, ch, o) {
  regAxis(key, { ...o, get: () => ch == null ? 0 : S.values[ch - 1] * 100, set: (out) => { if (ch != null) S.values[ch - 1] = out / 100; } });
}
function stopAxes() { for (const k in AXS) { AXS[k].held = false; AXS[k].anim = null; AXS[k].kb = false; } }
function setRaw(k, v) { const a = ax(k), d = AXD[k]; a.raw = clamp(v, -100, 100); if (d) d.set(RM.dz(a.raw, d.dz)); }
/** Không chạm và không đang tự về → đi theo giá trị bị đặt từ ngoài (thoát màn, failsafe…) */
function follow(k) {
  const a = ax(k), d = AXD[k];
  if (d && !a.held && !a.anim) { const g = d.get(); if (Math.abs(RM.dz(a.raw, d.dz) - g) > 0.01) a.raw = g; }
  return a;
}
let rafId = null;
function loop() { if (rafId == null) rafId = requestAnimationFrame(tick); }
function tick(now) {
  rafId = null;
  let any = false;
  for (const k in AXS) {
    const a = AXS[k];
    if (!a.anim) continue;
    if (!AXD[k]) { a.anim = null; continue; }
    const ms = now - a.anim.t0;
    setRaw(k, RM.valueAt(a.anim.cfg, a.anim.from, ms));
    if (ms >= RM.total(a.anim.cfg)) a.anim = null; else any = true;
  }
  drawAxes();
  if (any) loop();
}
function releaseAxis(k) {
  const a = ax(k), d = AXD[k];
  a.held = false;
  const cfg = d?.ret?.();
  if (cfg && returnsFrom(cfg, a.raw)) { a.anim = { cfg, from: a.raw, t0: performance.now() }; loop(); }
}

function renderItem(p, it) {
  const lbl = itemLabel(p, it), ch = it.channel;

  const iconName = PICK_ICONS[it.style.icon];

    case 'stickH': case 'stickV': {

    }

      return `<div class="chbtn${on ? ' on' : ''}" data-chbtn="${it.id}" ${toggle}>${iconName ? ic(iconName, { solid: on }) : ''}${lbl ? `<span class="lbl">${esc(lbl)}</span>` : ''}${it.kind === 'toggle' ? `<span class="caption">${on ? 'BẬT' : 'TẮT'}</span>` : ''}</div>`;
    }

        <div class="mid"><div style="font-size:26px;font-weight:800;line-height:1.1">Số ${g}</div><div class="muted" style="font-size:12px;font-weight:500">Ga tối đa ${p.gears.max[g - 1]}%</div></div>

function driveMenu(ev) {

// ---------- Vẽ cần gạt (tương đương _AxisPainter / _Stick2DPainter / _KnobPainter) ----------
function paintAxis(el, raw, d) {
  const vertical = d.vertical, w = el.clientWidth, h = el.clientHeight, short = Math.min(w, h);
  if (!w || !h) return;
  el.style.borderRadius = short / 2 + 'px';
  const pos = raw / 100;
  const thumbR = clamp(short * (0.45 + d.knob) / 2, 10, short / 2);
  const along = (vertical ? h : w) / 2 - thumbR;
  const cx = vertical ? w / 2 : w / 2 + pos * along, cy = vertical ? h / 2 - pos * along : h / 2;
  const [cl, bar, th] = el.children;
  Object.assign(cl.style, vertical ? { left: w * .2 + 'px', width: w * .6 + 'px', top: h / 2 - 1 + 'px', height: '2px' } : { top: h * .2 + 'px', height: h * .6 + 'px', left: w / 2 - 1 + 'px', width: '2px' });
  const bw = short * 0.3;
  if (vertical) Object.assign(bar.style, { left: w / 2 - bw / 2 + 'px', width: bw + 'px', top: Math.min(cy, h / 2) - bw / 2 + 'px', height: Math.abs(cy - h / 2) + bw + 'px' });
  else Object.assign(bar.style, { top: h / 2 - bw / 2 + 'px', height: bw + 'px', left: Math.min(cx, w / 2) - bw / 2 + 'px', width: Math.abs(cx - w / 2) + bw + 'px' });
  Object.assign(th.style, { left: cx - thumbR + 'px', top: cy - thumbR + 'px', width: thumbR * 2 + 'px', height: thumbR * 2 + 'px' });
}
function paint2d(el, x, y, knob) {
  const w = el.clientWidth, h = el.clientHeight, side = Math.min(w, h), r = side / 2, cx = w / 2, cy = h / 2;
  const [b, hl, vl, k] = el.children;
  Object.assign(b.style, { left: cx - r + 'px', top: cy - r + 'px', width: side + 'px', height: side + 'px' });
  Object.assign(hl.style, { left: cx - r * .8 + 'px', top: cy - .75 + 'px', width: r * 1.6 + 'px', height: '1.5px' });
  Object.assign(vl.style, { top: cy - r * .8 + 'px', left: cx - .75 + 'px', height: r * 1.6 + 'px', width: '1.5px' });
  const kr = r * (0.25 + knob * 0.5), travel = r - kr;
  const kx = cx + x / 100 * travel, ky = cy - y / 100 * travel;
  Object.assign(k.style, { left: kx - kr + 'px', top: ky - kr + 'px', width: kr * 2 + 'px', height: kr * 2 + 'px' });
}
function paintKnob(el, v) {
  const c = 50, r = 46, a0 = -Math.PI / 2 - Math.PI * 0.75, sweep = Math.PI * 1.5, mid = -Math.PI / 2;
  const pt = (a, rr = r) => `${(c + rr * Math.cos(a)).toFixed(2)} ${(c + rr * Math.sin(a)).toFixed(2)}`;
  const arc = (s, e) => `M${pt(s)}A${r} ${r} 0 ${e - s > Math.PI ? 1 : 0} 1 ${pt(e)}`;
  const a = v / 100 * sweep / 2, ang = mid + a;
  el.innerHTML = `<svg viewBox="0 0 100 100" style="width:100%;height:100%">
    <path d="${arc(a0, a0 + sweep)}" stroke="var(--line)" stroke-width="6" fill="none" stroke-linecap="round"/>
    ${Math.abs(a) > 0.001 ? `<path d="${arc(a >= 0 ? mid : mid + a, a >= 0 ? mid + a : mid)}" stroke="var(--accentFill)" stroke-width="6" fill="none" stroke-linecap="round"/>` : ''}
    <circle cx="50" cy="50" r="${r * 0.72}" fill="var(--surface2)"/>
    <path d="M${pt(ang, r * 0.25)}L${pt(ang, r * 0.62)}" stroke="var(--accentFill)" stroke-width="4" stroke-linecap="round"/></svg>`;
}
function drawAxes() {

  dev.dataset.t = t;
  document.documentElement.dataset.theme = t;
  dev.className = 'device ' + (S.screen === 'control' ? 'landscape' : 'portrait');
  const keep = {};
  scr.querySelectorAll('[data-scroll]').forEach((el) => { keep[el.dataset.scroll] = el.scrollTop; });
  const fn = { garage: renderGarage, wizard: renderWizard, settings: renderSettings, channel: renderChannel, mix: renderMix, control: renderControl }[S.screen];
  scr.innerHTML = fn() + renderOverlay();
  scr.querySelectorAll('[data-scroll]').forEach((el) => { if (keep[el.dataset.scroll] != null) el.scrollTop = keep[el.dataset.scroll]; });
  drawAxes();
  requestAnimationFrame(drawAxes);
  renderNav();
  fit();
}
function renderNav() {
  const nav = [['garage', 'Xe của tôi'], ['wizard', 'Tạo xe mới'], ['control', 'Màn Lái'], ['settings', 'Cấu hình']];
  const cur = S.screen === 'channel' || S.screen === 'mix' ? 'settings' : S.screen;
  document.getElementById('nav').innerHTML = nav.map(([k, l]) => `<button class="tb${cur === k ? ' on' : ''}" data-nav="${k}">${l}</button>`).join('');
  document.getElementById('themeBtn').textContent = effectiveTheme() === 'dark' ? '☾ Tối' : '☀ Sáng';
}
function fit() {
  const stage = document.getElementById('stage'), frame = document.getElementById('frame');
  frame.style.transform = 'none';
  const s = Math.min(1, (stage.clientWidth - 24) / frame.offsetWidth, (stage.clientHeight - 24) / frame.offsetHeight);
  frame.style.transform = `scale(${s})`;
}

// ============================================================================
//  Sự kiện
// ============================================================================
document.getElementById('nav').addEventListener('click', (e) => {
  const k = e.target.dataset.nav;
  if (!k) return;
  const p0 = S.profiles[0];
  if ((k === 'control' || k === 'settings') && !p0) { snack('Chưa có xe nào — tạo xe trước'); return; }
  leaveControl();
  S.history = []; S.overlay = null; S.screen = 'garage';
  const pid = S.connectedId && prof(S.connectedId) ? S.connectedId : p0?.id;
  if (k === 'wizard') openWizard();
  else if (k === 'control') openControl(pid);
  else if (k === 'settings') openSettings(pid);
  else render();
});
document.getElementById('themeBtn').onclick = () => { S.theme = effectiveTheme() === 'dark' ? 'light' : 'dark'; render(); };
document.getElementById('simFail').onchange = render;
document.getElementById('simEmpty').onchange = render;
document.getElementById('simLost').onchange = (e) => {
  if (S.connectedId && (S.link === 'connected' || S.link === 'lost')) S.link = e.target.checked ? 'lost' : 'connected';
  render();
};
window.addEventListener('resize', () => { fit(); drawAxes(); });

// Nhấn giữ nút −/+ (đổi gấp 10 lần)
let lpTimer = null, lpFired = false;

scr.addEventListener('click', (e) => {
  if (lpFired) { lpFired = false; return; }
  const m = e.target.closest('[data-menu]');
  if (m) { const fn = actions[m.dataset.menu]; if (fn) fn({ currentTarget: m }); return; }
  const stop = e.target.closest('[data-stop]');
  const a = stop ? (stop.dataset.act ? stop : null) : e.target.closest('[data-act]');
  if (!a || a.disabled) return;
  const fn = actions[a.dataset.act];
  if (fn) { fn(e); render(); }
});
scr.addEventListener('input', (e) => {
  const el = e.target;
  if (el.dataset.rg) {
    const r = RG[el.dataset.rg];
    if (!r) return;
    if (!r.started) { r.started = true; r.start?.(); }
    const v = +el.value;
    r.set(v);
    if (r.label) { const l = scr.querySelector(`[data-rgl="${el.dataset.rg}"]`); if (l) l.textContent = r.label(v); }
    r.after?.(v);
    return;
  }
  if (el.dataset.in) {
    const fn = INP[el.dataset.in];
    if (!fn) return;
    const fid = el.dataset.fid, pos = el.selectionStart;
    fn(el.value);
    render();
    const again = scr.querySelector(`[data-fid="${fid}"]`);
    if (again) { again.focus(); try { again.setSelectionRange(pos, pos); } catch (_) {} }
  }
});
scr.addEventListener('change', (e) => {
  const el = e.target;
  if (el.dataset.rg) {
    if (S.screen === 'channel') S.chEdit.preview = 0; // thả tay → thanh xem trước về 0
    render();
    return;
  }
  if (el.dataset.sel) { const fn = INP[el.dataset.sel]; if (fn) { fn(el.value); render(); } }
});
scr.addEventListener('dblclick', (e) => {
  const k = e.target.closest('[data-knob]');
  if (k && !S.ctl?.editing) { setRaw(k.dataset.knob + ':k', 0); drawAxes(); }
});

// Chạm: cần gạt, núm, nút giữ, kéo/đổi cỡ khi sửa bố cục, kéo đổi thứ tự luật mix. Hỗ trợ nhiều ngón.
const drags = new Map();
scr.addEventListener('pointerdown', (e) => {
  lpFired = false;
  const lp = e.target.closest('[data-lp]');
  if (lp && !lp.disabled) {
    clearTimeout(lpTimer);
    const k = lp.dataset.lp;
    lpTimer = setTimeout(() => { lpFired = true; actions[k]?.(); render(); }, 500);
  }
  if (S.overlay) return;
  const ro = e.target.closest('[data-reorder]');
  if (ro) { drags.set(e.pointerId, { mode: 'reorder', from: +ro.dataset.reorder, to: null }); e.preventDefault(); return; }
  const editing = S.screen === 'control' && S.ctl?.editing;
  const axEl = e.target.closest('[data-axis]');
  if (axEl && !(editing && axEl.closest('#canvas'))) {
    const key = axEl.dataset.axis, a = ax(key);
    a.held = true; a.anim = null;
    const d = { mode: 'axis', key };
    drags.set(e.pointerId, d);
    moveAxis(e, d);
    e.preventDefault();
    return;
  }
  if (S.screen !== 'control' || !S.ctl) return;
  const c = S.ctl;
  if (editing) {
    if (!e.target.closest('#canvas')) return;
    const rz = e.target.closest('[data-rz]'), itEl = e.target.closest('[data-item]');
    if (!itEl) { c.sel = null; render(); return; }
    const it = c.draft.items.find((i) => i.id === itEl.dataset.item);
    // Chọn phần tử làm hiện bảng thuộc tính → canvas hẹp lại, nên đo sau khi vẽ lại
    if (c.sel !== it.id) { c.sel = it.id; render(); }
    const cv = document.getElementById('canvas'), r = cv.getBoundingClientRect();
    const scale = r.width / cv.offsetWidth;
    drags.set(e.pointerId, { mode: rz ? 'resize' : 'move', it, start: { ...it }, sx: e.clientX, sy: e.clientY, cw: r.width / COLS, ch: r.height / ROWS, scale, pushed: false });
    e.preventDefault();
    return;
  }
  const s2 = e.target.closest('[data-s2]');
  if (s2) {
    const id = s2.dataset.s2;
    for (const k of [id + ':x', id + ':y']) { const a = ax(k); a.held = true; a.anim = null; }
    const d = { mode: 's2', id };
    drags.set(e.pointerId, d);
    moveS2(e, d);
    e.preventDefault();
    return;
  }
  const kn = e.target.closest('[data-knob]');
  if (kn) {
    const key = kn.dataset.knob + ':k', r = kn.getBoundingClientRect();
    ax(key).held = true;
    drags.set(e.pointerId, { mode: 'knob', key, y0: e.clientY, raw0: follow(key).raw, side: Math.min(r.width, r.height) || 1 });
    e.preventDefault();
    return;
  }
  const btn = e.target.closest('[data-chbtn]');
  if (btn) {
    const it = ctlLayout().items.find((i) => i.id === btn.dataset.chbtn);
    if (it?.kind === 'button') {
      const ch = it.channel, cfg = ctlProfile().channels[ch - 1];
      S.sw[ch] = 1; S.values[ch - 1] = switchPct(cfg, 'button', 1) / 100;
      drags.set(e.pointerId, { mode: 'button', ch, cfg });
      render();
    }
  }
});
function moveAxis(e, d) {
  const el = scr.querySelector(`[data-axis="${d.key}"]`), desc = AXD[d.key];
  if (!el || !desc) return;
  const r = el.getBoundingClientRect();
  const v = desc.vertical ? (1 - (e.clientY - r.top) / r.height * 2) * 100 : ((e.clientX - r.left) / r.width * 2 - 1) * 100;
  setRaw(d.key, v);
  drawAxes();
}
function moveS2(e, d) {
  const el = scr.querySelector(`[data-s2="${d.id}"]`);
  if (!el) return;
  const r = el.getBoundingClientRect(), half = Math.min(r.width, r.height) / 2;
  setRaw(d.id + ':x', (e.clientX - (r.left + r.width / 2)) / half * 100);
  setRaw(d.id + ':y', -(e.clientY - (r.top + r.height / 2)) / half * 100);
  drawAxes();
}
window.addEventListener('pointermove', (e) => {
  const d = drags.get(e.pointerId);
  if (!d) return;
  if (d.mode === 'axis') { moveAxis(e, d); return; }
  if (d.mode === 's2') { moveS2(e, d); return; }
  if (d.mode === 'knob') { setRaw(d.key, d.raw0 - (e.clientY - d.y0) / d.side * 200); drawAxes(); return; }
  if (d.mode === 'reorder') {
    const cards = [...scr.querySelectorAll('[data-mi]')];
    let to = cards.length;
    for (const [i, el] of cards.entries()) { const r = el.getBoundingClientRect(); if (e.clientY < r.top + r.height / 2) { to = i; break; } }
    d.to = to;
    cards.forEach((el, i) => el.classList.toggle('dropto', i === to && to !== d.from && to !== d.from + 1));
    return;
  }
  if (d.mode !== 'move' && d.mode !== 'resize') return;
  const c = S.ctl, it = d.it, s = d.start;
  const dx = Math.round((e.clientX - d.sx) / d.cw), dy = Math.round((e.clientY - d.sy) / d.ch);
  let r;
  if (d.mode === 'move') r = { x: clamp(s.x + dx, 0, COLS - s.w), y: clamp(s.y + dy, 0, ROWS - s.h), w: s.w, h: s.h };
  else {
    const [mnW, mnH, mxW, mxH] = limitsFor(it.kind, d.cw / d.scale, d.ch / d.scale, touchable(it));
    r = { x: s.x, y: s.y, w: clamp(s.w + dx, mnW, Math.min(mxW, COLS - s.x)), h: clamp(s.h + dy, mnH, Math.min(mxH, ROWS - s.y)) };
  }
  if ((r.x !== it.x || r.y !== it.y || r.w !== it.w || r.h !== it.h) && fits(c.draft, r, it.id)) {
    if (!d.pushed) { const snap = clone(c.draft); Object.assign(snap.items.find((i) => i.id === it.id), { x: s.x, y: s.y, w: s.w, h: s.h }); c.undo.push(snap); if (c.undo.length > 30) c.undo.shift(); c.redo = []; d.pushed = true; }
    Object.assign(it, r);
    const el = scr.querySelector(`[data-item="${it.id}"]`);
    if (el) Object.assign(el.style, { left: it.x / COLS * 100 + '%', top: it.y / ROWS * 100 + '%', width: it.w / COLS * 100 + '%', height: it.h / ROWS * 100 + '%' });
    drawAxes();
  }
  drawGuides(c.draft, it.id, it, d.cw / d.scale, d.ch / d.scale);
  if (d.mode === 'move') {
    const trash = document.getElementById('trash');
    const tr = trash.getBoundingClientRect();
    d.over = e.clientX >= tr.left && e.clientX <= tr.right && e.clientY >= tr.top - 8 && e.clientY <= tr.bottom + 8;
    trash.classList.add('hot'); trash.classList.toggle('over', d.over);
    document.getElementById('trashTxt').textContent = 'Thả vào đây để xoá';
  }
});
function endPointer(e) {
  clearTimeout(lpTimer);
  const d = drags.get(e.pointerId);
  if (!d) return;
  drags.delete(e.pointerId);
  if (d.mode === 'axis') { releaseAxis(d.key); drawAxes(); }
  else if (d.mode === 's2') { releaseAxis(d.id + ':x'); releaseAxis(d.id + ':y'); drawAxes(); }
  else if (d.mode === 'knob') { ax(d.key).held = false; }
  else if (d.mode === 'button') { S.sw[d.ch] = 0; S.values[d.ch - 1] = switchPct(d.cfg, 'button', 0) / 100; render(); }
  else if (d.mode === 'reorder') {
    const mixes = S.settings?.draft.mixes;
    if (mixes && d.to != null && d.to !== d.from && d.to !== d.from + 1) {
      let to = d.to;
      if (to > d.from) to--;
      mixes.splice(to, 0, mixes.splice(d.from, 1)[0]);
    }
    render();
  } else if (d.mode === 'move' || d.mode === 'resize') {
    if (d.over) {
      if (!d.pushed) pushUndo();
      S.ctl.draft.items = S.ctl.draft.items.filter((i) => i.id !== d.it.id);
      S.ctl.sel = null;
    }
    render();
  }
}
window.addEventListener('pointerup', endPointer);
window.addEventListener('pointercancel', endPointer);

// Bàn phím: W/S ga (CH2), A/D lái (CH1) — như ngón tay giữ cần, thả phím thì tự về theo cài đặt
const keys = new Set();
function axisKeyFor(ch) {
  const it = itemFor(ctlLayout(), ch);
  if (!it) return null;
  if (it.kind === 'stickH' || it.kind === 'stickV') return it.id + ':x';
  if (it.kind === 'stick2D') return it.id + (it.channel === ch ? ':x' : ':y');
  return null;
}
function applyKeys() {
  if (S.screen !== 'control' || !S.ctl || S.ctl.editing) return;
  const dirs = { 1: (keys.has('d') ? 1 : 0) - (keys.has('a') ? 1 : 0), 2: (keys.has('w') ? 1 : 0) - (keys.has('s') ? 1 : 0) };
  for (const ch of [1, 2]) {
    const k = axisKeyFor(ch);
    if (!k || !AXD[k]) continue;
    const a = ax(k);
    if (dirs[ch]) { a.held = true; a.kb = true; a.anim = null; setRaw(k, dirs[ch] * 100); }
    else if (a.kb) { a.kb = false; releaseAxis(k); }
  }
  drawAxes();
}
window.addEventListener('keydown', (e) => {
  if (['INPUT', 'SELECT'].includes(e.target.tagName) || e.repeat) return;
  keys.add(e.key.toLowerCase()); applyKeys();
});
window.addEventListener('keyup', (e) => { keys.delete(e.key.toLowerCase()); applyKeys(); });

// Telemetry giả lập khi đang kết nối
let battery = 8.2;
setInterval(() => {
  if (S.screen !== 'control' || !S.ctl) return;
  const p = ctlProfile();
  if (!p) return;
  const failsafe = document.getElementById('simFail').checked;
  if (S.connectedId !== p.id || S.link !== 'connected') { if (S.connectedId !== p.id) S.tel = null; updateGauges(); return; }
  const wasFail = !!S.tel?.failsafe;
  const lim = p.gears.max[clamp(S.gear, 1, p.gears.count) - 1] / 100;
  const thr = failsafe ? 0 : S.values[1] * lim;
  battery = Math.max(6.4, battery - 0.0004 - Math.abs(thr) * 0.002);
  S.tel = { failsafe, v: battery - Math.abs(thr) * 0.35, a: 0.4 + Math.abs(thr) * 18 + Math.random() * 0.3, kmh: Math.abs(thr) * 42 + (thr ? Math.random() : 0), rssi: -55 - Math.round(Math.random() * 6) };
  if (wasFail !== failsafe) render(); else updateGauges();
}, 200);

// Mở thẳng một màn: ui_preview.html#control | #settings | #wizard | #light | #connected
render();
const hash = location.hash.slice(1).split(',');
if (hash.includes('light')) { S.theme = 'light'; render(); }
if (hash.includes('connected')) { const p = S.profiles[0]; S.connectedId = p.id; S.link = 'connected'; S.carCfg[p.id] = carConfigOf(p); }
const startNav = hash.find((h) => ['control', 'settings', 'wizard'].includes(h));
if (startNav) document.querySelector(`[data-nav="${startNav}"]`).click();
</script>
</body>
