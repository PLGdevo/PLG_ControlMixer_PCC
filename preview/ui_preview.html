<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RC Controller Preview</title>
<!-- Bản xem trước app Flutter (app/lib) — chạy thẳng trong trình duyệt, dữ liệu giả lập, không kết nối xe thật.
     Logic được port từ: models/*, services/{input_manager, condition_engine, mixer_engine, output_pipeline, arm_controller, car_discovery}.dart,
     protocol/net_protocol.dart, layout/*, screens/*, widgets/{condition_builder, mix_preview, mix_rule_card}.dart. Sửa app thì sửa cả file này.
     Xe giả lập có 3 chế độ mạng (AP / Router / Cấu hình) như firmware net_manager (dac_ta_wifi_3_che_do.md). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --page: #0e0e0e; --page-text: #e6e6e6; --page-muted: #98989a; --page-line: #2a2a2a;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) { --page: #eef0ea; --page-text: #191919; --page-muted: #59595a; --page-line: #d6d6d6; }
}
:root[data-theme="light"] { --page: #eef0ea; --page-text: #191919; --page-muted: #59595a; --page-line: #d6d6d6; }
:root[data-theme="dark"] { --page: #0e0e0e; --page-text: #e6e6e6; --page-muted: #98989a; --page-line: #2a2a2a; }

/* Token app — lấy từ app/lib/theme/tokens.dart */
.device[data-t="dark"] {
  --bg:#191919; --surface:#262626; --surface2:#333333; --line:#333333;
  --text:#ffffff; --textBody:#e6e6e6; --textMuted:#98989a; --disabled:#59595a;
  --accent:#9EFF00; --accentFill:#9EFF00; --accentFillPressed:#B1FF33; --onAccentFill:#191919;
  --accentContainer:rgba(158,255,0,.12); --onAccentContainer:#C5FF66;
  --ok:#4CAF50; --warn:#FFC107; --bad:#F44336; --idle:#98989a;
}
.device[data-t="light"] {
  --bg:#FDFFFA; --surface:#ffffff; --surface2:#F9FFF0; --line:#E6E6E6;
  --text:#191919; --textBody:#4C4C4D; --textMuted:#59595A; --disabled:#98989A;
  --accent:#3D6600; --accentFill:#9EFF00; --accentFillPressed:#B1FF33; --onAccentFill:#191919;
  --accentContainer:#ECFFCC; --onAccentContainer:#191919;
  --ok:#2E7D32; --warn:#B26A00; --bad:#C62828; --idle:#59595A;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--page); color: var(--page-text); font-family: Barlow, system-ui, sans-serif; overflow: hidden; }
button { font-family: inherit; }

/* ---------- Khung trang ---------- */
.shell { display: flex; flex-direction: column; height: 100%; }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--page-line); }
.toolbar h1 { font-size: 16px; font-weight: 700; margin: 0 12px 0 0; }
.toolbar .grp { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
.toolbar .sep { width: 1px; height: 24px; background: var(--page-line); margin: 0 4px; }
.tb { background: transparent; color: var(--page-text); border: 1px solid var(--page-line); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 500; cursor: pointer; }
.tb.on { background: #9EFF00; color: #191919; border-color: #9EFF00; }
.tb:hover:not(.on) { border-color: var(--page-muted); }
.toolbar label { font-size: 13px; color: var(--page-muted); display: flex; gap: 6px; align-items: center; cursor: pointer; }
.hint { font-size: 12px; color: var(--page-muted); margin-left: auto; }
.stage { flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
.frame { border-radius: 36px; padding: 10px; background: #050505; box-shadow: 0 0 0 1px #333, 0 20px 60px rgba(0,0,0,.45); transform-origin: center; }

/* ---------- Thiết bị ---------- */
.device { position: relative; overflow: hidden; border-radius: 28px; background: var(--bg); color: var(--text);
  font-family: Barlow, system-ui, sans-serif; font-size: 15px; font-variant-numeric: tabular-nums; }
.device.portrait { width: 390px; height: 800px; }
.device.landscape { width: 820px; height: 380px; }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; }
.device svg.ic { width: 24px; height: 24px; flex: none; }
.device svg.ic.mini { width: 20px; height: 20px; }

.appbar { height: 56px; flex: none; display: flex; align-items: center; gap: 4px; padding: 0 4px 0 8px; background: var(--surface); border-bottom: 1px solid var(--line); }
.appbar .title { font-size: 18px; font-weight: 600; flex: 1; padding-left: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.iconbtn { width: 48px; height: 48px; border-radius: 999px; border: 0; background: transparent; color: var(--text); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; flex: none; }
.iconbtn:hover { background: color-mix(in srgb, var(--text) 8%, transparent); }
.iconbtn:disabled { color: var(--disabled); cursor: default; background: transparent; }
.iconbtn.outlined { width: 40px; height: 40px; border: 1px solid var(--line); }
.body { flex: 1; overflow-y: auto; padding: 16px; }
.body::-webkit-scrollbar { width: 0; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 20px; border-radius: 999px;
  font-size: 14px; font-weight: 500; cursor: pointer; border: 1px solid transparent; white-space: nowrap; }
.btn.filled { background: var(--accentFill); color: var(--onAccentFill); }
.btn.filled:hover { background: var(--accentFillPressed); }
.btn.filled:disabled { background: var(--surface2); color: var(--disabled); cursor: default; }
.btn.outlined { background: transparent; color: var(--text); border-color: var(--line); padding: 0 18px; }
.btn.outlined:hover { background: color-mix(in srgb, var(--text) 6%, transparent); }
.btn.outlined:disabled { color: var(--disabled); cursor: default; background: transparent; }
.btn.text { background: transparent; color: var(--accent); padding: 0 12px; }
.btn.text:hover { background: var(--accentContainer); }
.btn.text:disabled { color: var(--disabled); cursor: default; background: transparent; }
.btn.small { min-height: 36px; padding: 0 12px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; margin: 4px 0; }
.card.sel { border-color: var(--accent); }
.caption { font-size: 12px; font-weight: 500; letter-spacing: .96px; color: var(--textMuted); }
.muted { color: var(--textMuted); }
.lbl { font-size: 14px; font-weight: 500; }
.h-title { font-size: 18px; font-weight: 600; }

.pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; border: 1px solid currentColor; font-size: 14px; font-weight: 600; white-space: nowrap; }
.pill .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }

.spinner { width: 16px; height: 16px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.fab { position: absolute; right: 16px; bottom: 16px; height: 56px; padding: 0 20px 0 16px; border-radius: 999px; border: 0; background: var(--accentFill); color: var(--onAccentFill);
  display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; cursor: pointer; }

/* Ô nhập */
.field { position: relative; margin-bottom: 4px; }
.field input, .field select { width: 100%; height: 56px; padding: 22px 14px 6px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface2); color: var(--text);
  font: 400 15px Barlow, system-ui, sans-serif; outline: none; }
.field select { cursor: pointer; }
.field input:focus, .field select:focus { border: 1.5px solid var(--accent); }
.field label { position: absolute; left: 15px; top: 8px; font-size: 12px; color: var(--textMuted); pointer-events: none; }
.field input:focus + label { color: var(--accent); }
.field.err input { border-color: var(--bad); }
.field .errtxt { color: var(--bad); font-size: 12px; font-weight: 500; padding: 4px 14px 0; }
.field .count { text-align: right; font-size: 12px; color: var(--textMuted); padding: 4px 4px 0; }
.field.dense input, .field.dense select { height: 48px; padding-top: 18px; }
.field.dense label { top: 5px; }
.tin { width: 100%; height: 44px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface2); color: var(--text); font: 400 15px Barlow, system-ui, sans-serif; outline: none; }
.tin:focus { border: 1.5px solid var(--accent); }

.seg { display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.seg button { flex: 1; height: 40px; border: 0; background: transparent; color: var(--text); font-size: 14px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; padding: 0 4px; white-space: nowrap; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on { background: var(--accentContainer); color: var(--onAccentContainer); }
.seg.sm button { height: 34px; font-size: 13px; }

.switch { width: 52px; height: 32px; border-radius: 999px; background: var(--surface2); border: 2px solid var(--line); position: relative; cursor: pointer; flex: none; }
.switch::after { content: ""; position: absolute; left: 4px; top: 4px; width: 20px; height: 20px; border-radius: 50%; background: var(--textMuted); transition: .15s; }
.switch.on { background: var(--accentFill); border-color: var(--accentFill); }
.switch.on::after { left: 24px; width: 24px; height: 24px; top: 2px; background: var(--onAccentFill); }
.switch.dis { opacity: .4; cursor: default; }

.chip { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--text); font: 500 14px Barlow, system-ui, sans-serif; cursor: pointer; }
.chip.on { background: var(--accentContainer); color: var(--onAccentContainer); border-color: transparent; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }

input[type=range] { width: 100%; accent-color: var(--accentFill); margin: 6px 0; cursor: pointer; }
input[type=range]:disabled { cursor: default; opacity: .4; }

.numfield { display: flex; align-items: center; gap: 8px; padding: 6px 0; }
.numfield .nl { flex: 1; }
.numfield .nv { min-width: 96px; text-align: center; height: 44px; line-height: 44px; border-radius: 12px; background: var(--surface2); border: 1px solid var(--line); font-weight: 600; }
.numfield.err .nv { border-color: var(--bad); color: var(--bad); }
.numerr { color: var(--bad); font-size: 12px; font-weight: 500; margin-top: -2px; margin-bottom: 4px; }
.divider { height: 1px; background: var(--line); margin: 12px 0; }
.srow { display: flex; align-items: center; gap: 12px; padding: 8px 0; }
.srow .st { flex: 1; }
.srow .st small { display: block; color: var(--textMuted); font-size: 13px; }

.tabs { display: flex; gap: 4px; padding: 0 12px 8px; background: var(--surface); border-bottom: 1px solid var(--line); overflow-x: auto; flex: none; }
.tabs button { height: 40px; padding: 0 13px; border: 0; border-radius: 999px; background: transparent; color: var(--textMuted); font-size: 14px; font-weight: 500; cursor: pointer; }
.tabs button.on { background: var(--accentFill); color: var(--onAccentFill); }
.bottombar { flex: none; background: var(--surface); border-top: 1px solid var(--line); padding: 8px 12px 12px; }

.radio { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--textMuted); flex: none; position: relative; }
.radio.on { border-color: var(--accent); }
.radio.on::after { content: ""; position: absolute; inset: 3px; border-radius: 50%; background: var(--accent); }

/* Menu, hộp thoại, snackbar */
.scrim { position: absolute; inset: 0; z-index: 40; }
.scrim.dim { background: rgba(0,0,0,.5); display: flex; align-items: center; justify-content: center; }
.menu { position: absolute; background: var(--surface2); border-radius: 12px; padding: 6px 0; min-width: 200px; box-shadow: 0 8px 24px rgba(0,0,0,.35); z-index: 41; }
.menu .mi { display: flex; align-items: center; gap: 16px; padding: 10px 16px; cursor: pointer; color: var(--text); }
.menu .mi:hover { background: color-mix(in srgb, var(--text) 8%, transparent); }
.menu .mi.dis { color: var(--disabled); cursor: default; background: transparent; }
.menu .mi .ic { color: var(--textMuted); }
.menu .mi small { display: block; color: var(--textMuted); font-size: 13px; }
.menu .mi.chk { color: var(--accent); }
.dialog { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 24px; width: min(340px, 86%); }
.dialog h3 { margin: 0 0 12px; font-size: 18px; font-weight: 600; }
.dialog p { margin: 0 0 20px; color: var(--textBody); }
.dialog .acts { display: flex; justify-content: flex-end; gap: 8px; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); border-radius: 16px 16px 0 0; padding: 8px 16px 16px; max-height: 80%; overflow-y: auto; z-index: 41; }
.sheet .handle { width: 32px; height: 4px; border-radius: 2px; background: var(--textMuted); margin: 8px auto 16px; opacity: .5; }
.sheet .row { display: flex; align-items: center; gap: 16px; padding: 12px 4px; cursor: pointer; border-radius: 12px; }
.sheet .row:hover { background: var(--surface2); }
.snack { position: absolute; left: 12px; right: 12px; bottom: 12px; background: var(--surface2); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; color: var(--text);
  z-index: 60; transform: translateY(140%); transition: transform .2s; pointer-events: none; }
.snack.show { transform: none; }
.landscape .snack { left: 50%; right: auto; width: 420px; margin-left: -210px; }

/* ---------- Màn Lái ---------- */
.drive { padding: 4px 8px 8px; min-width: 0; }
.trash { min-width: 0; overflow: hidden; }
.trash span { overflow: hidden; text-overflow: ellipsis; }
.drivebar { height: 48px; display: flex; align-items: center; gap: 4px; flex: none; }
.alarm { display: inline-flex; align-items: center; gap: 8px; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--bad); color: var(--bad);
  background: color-mix(in srgb, var(--bad) 18%, transparent); font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; max-width: 100%; }
.canvas { position: relative; flex: 1; margin-top: 4px; touch-action: none; user-select: none; }
.canvas.editing { background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size: calc(100% / 24) calc(100% / 12); outline: 1px dashed var(--line); border-radius: 4px; }
.item { position: absolute; padding: 3px; }
.item > .in { width: 100%; height: 100%; }
.canvas.editing .item > .in { pointer-events: none; }
.canvas.editing .item { cursor: grab; }
.canvas.editing .item.sel > .in { outline: 2px solid var(--accent); border-radius: 16px; }
.canvas.editing .item .rz { position: absolute; right: 0; bottom: 0; width: 18px; height: 18px; border-radius: 50%; background: var(--accentFill); border: 3px solid var(--bg); cursor: nwse-resize; display: none; }
.canvas.editing .item.sel .rz { display: block; }
#guides { position: absolute; inset: 0; pointer-events: none; }
#guides .gl { position: absolute; background: var(--accent); opacity: .7; }
.frameitem { height: 100%; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 8px; }
.frameitem .hd { display: flex; align-items: center; gap: 4px; padding-bottom: 4px; }
.frameitem .hd .caption { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-transform: uppercase; }
.frameitem .hd .val { font-size: 12px; font-weight: 500; letter-spacing: .96px; color: var(--text); white-space: nowrap; }
.frameitem .ct { flex: 1; position: relative; min-height: 0; }
.axis { position: absolute; inset: 0; background: var(--surface2); cursor: pointer; touch-action: none; }
.axis.pv { position: relative; height: 44px; margin-top: 4px; }
.axis .cl { position: absolute; background: var(--line); }
.axis .bar { position: absolute; background: color-mix(in srgb, var(--accentFill) 35%, transparent); border-radius: 999px; }
.axis .th { position: absolute; border-radius: 50%; background: var(--accentFill); }
.axis .th::after { content: ""; position: absolute; inset: 32%; border-radius: 50%; border: 1.5px solid color-mix(in srgb, var(--onAccentFill) 25%, transparent); }
.s2 { position: absolute; inset: 0; cursor: pointer; touch-action: none; }
.s2 .b2 { position: absolute; border-radius: 50%; background: var(--surface2); }
.s2 .h2, .s2 .v2 { position: absolute; background: var(--line); }
.s2 .k2 { position: absolute; border-radius: 50%; background: var(--accentFill); }
.knob { position: absolute; inset: 0; cursor: ns-resize; touch-action: none; }
.sw3 { display: flex; height: 100%; max-height: 44px; background: var(--surface2); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.sw3 button { flex: 1; border: 0; border-radius: 999px; background: transparent; color: var(--textMuted); font-size: 14px; cursor: pointer; }
.sw3 button.on { background: var(--accentFill); color: var(--onAccentFill); }
.chbtn { height: 100%; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); color: var(--text); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer; transition: background .09s; overflow: hidden; }
.chbtn.on { background: var(--accentFill); border-color: var(--accentFill); color: var(--onAccentFill); }
.chbtn .lbl { font-weight: 600; }
.chbtn .caption { font-size: 11px; }
.chbtn.on .caption { color: var(--onAccentFill); }
.gauge { height: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 4px 8px; }
.gauge { overflow: hidden; white-space: nowrap; }
.gauge .gh { display: flex; align-items: center; gap: 4px; color: var(--textMuted); }
.gauge .gh svg { width: 14px; height: 14px; }
.gauge .gv { font-size: 18px; font-weight: 700; }
.gauge .gs { font-size: 11px; color: var(--textMuted); }
.rowctl { display: flex; align-items: center; gap: 4px; height: 100%; }
.rowctl .mid { flex: 1; text-align: center; min-width: 0; }
.panel { width: 340px; flex: none; background: var(--surface); border-left: 1px solid var(--line); display: flex; flex-direction: column; }
.panel .body { padding: 8px 16px 24px; }
.trash.hot { border-color: var(--bad) !important; color: var(--bad) !important; }
.trash.over { background: color-mix(in srgb, var(--bad) 25%, transparent); }

/* Mix */
.mixcard.dropto { box-shadow: 0 -3px 0 var(--accent); }
.pvbar { display: flex; align-items: center; gap: 8px; padding: 3px 0; font-size: 14px; }
.pvbar .pl { width: 96px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pvbar .pt { flex: 1; height: 14px; position: relative; border-radius: 999px; background: var(--surface2); overflow: hidden; }
.pvbar .pf { position: absolute; top: 0; bottom: 0; border-radius: 999px; }
.pvbar .pz { position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: var(--line); }
.pvbar .pv { width: 52px; text-align: right; font-weight: 600; }
/* Điều kiện */
.cond { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 8px 4px 4px 12px; margin-top: 8px; }
.selsm { height: 44px; padding: 0 8px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface2); color: var(--text); font: 600 15px Barlow, system-ui, sans-serif; cursor: pointer; }
.cbrow { display: flex; align-items: center; gap: 10px; padding: 8px 0 4px; cursor: pointer; font-size: 14px; font-weight: 500; }
.cbx { width: 18px; height: 18px; border-radius: 4px; border: 2px solid var(--textMuted); display: inline-flex; align-items: center; justify-content: center; flex: none; }
.cbx.on { background: var(--accentFill); border-color: var(--accentFill); }
.cbx.on::after { content: ""; width: 4px; height: 9px; border: solid var(--onAccentFill); border-width: 0 2px 2px 0; transform: translateY(-1px) rotate(45deg); }
.seg.dis { opacity: .45; pointer-events: none; }
.field .helper { color: var(--textMuted); font-size: 12px; font-weight: 500; padding: 4px 14px 0; }
.field input:disabled { color: var(--disabled); }
.dialog p { white-space: pre-line; }
.dialog .dlist { max-height: 220px; overflow-y: auto; margin: 0 0 16px; }
/* ARM, chấm mix, ô Kênh đầu ra */
.armbtn { height: 36px; padding: 0 14px 0 12px; border-radius: 999px; display: inline-flex; align-items: center; gap: 6px; flex: none; background: var(--surface2); border: 1px solid var(--line);
  font-size: 14px; font-weight: 700; white-space: nowrap; cursor: pointer; user-select: none; touch-action: none; }
.armbtn.ready { border-color: var(--accent); }
.armbtn.armed { background: var(--accentFill); border-color: var(--accentFill); }
.armbtn .armic { display: inline-flex; width: 20px; height: 20px; align-items: center; justify-content: center; }
.armbtn .armic svg:not(.ic) { width: 16px; height: 16px; }
.item > .in { position: relative; }
.mixdot { position: absolute; top: 4px; right: 4px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); pointer-events: none; }
.mon { display: flex; height: 100%; }
.mon .mb { flex: 1; min-width: 0; display: flex; flex-direction: column; padding: 0 1.5px; }
.mon .mt { flex: 1; position: relative; background: var(--surface2); }
.mon .mf { position: absolute; left: 0; right: 0; top: 50%; height: 1px; }
.mon span { font-size: 9px; font-weight: 500; line-height: 1.3; color: var(--textMuted); text-align: center; }
.metrics { display: flex; justify-content: space-around; text-align: center; }
.metrics .v { font-size: 18px; font-weight: 700; }
/* Mạng của xe: ô mật khẩu có nút hiện/ẩn */
.field.sfx input { padding-right: 52px; }
.field .sfxbtn { position: absolute; right: 4px; top: 4px; }
</style>
</head>
<body>
<div class="shell">
  <div class="toolbar">
    <h1>RC Controller · xem trước</h1>
    <div class="grp" id="nav"></div>
    <div class="sep"></div>
    <div class="grp">

/** NumberField: −/+ theo bước, giữ lâu đổi gấp 10 lần */

function lastConnected(p) {
  if (!p.lastConnectedAt) return 'Chưa kết nối lần nào';
  const d = new Date(p.lastConnectedAt), two = (n) => String(n).padStart(2, '0');
  return `Kết nối lần cuối ${two(d.getDate())}/${two(d.getMonth() + 1)} ${two(d.getHours())}:${two(d.getMinutes())}`;
}
/** QuickPing giả lập: WiFi trả lời nếu đúng địa chỉ xe giả lập đang nghe, BLE trả lời nếu đúng MAC xe mẫu */
const carReachable = (conn, ip, port, mac) => conn === 'wifi' ? carAnswers(ip, port) : carUp() && mac.toUpperCase() === DEMO_BLE;
function quickPing(conn, ip, port, mac, done) {
  setTimeout(() => {
    if (conn === 'ble' && !mac) return done({ ok: false, label: '✗ Chưa có MAC' });
    if (conn === 'wifi' && !isIpv4(ip)) return done({ ok: false, label: '✗ IP không hợp lệ' });
    const ok = carReachable(conn, ip, port, mac);
    done(ok ? { ok, label: `✓ ${8 + Math.round(Math.random() * 12)} ms` } : { ok, label: '✗ Không phản hồi' });
  }, 800);
}
/** Chế độ Router: IP do router cấp có thể đổi → dò xe theo mã xe, cập nhật hồ sơ nếu IP/port khác.
 *  done(found): found = có thấy xe trong mạng (hồ sơ chưa có mã xe thì coi như thấy) */
function locate(p, done) {
  const id = p.wifi.carId;
  if (p.conn !== 'wifi' || !id) { done(true); return; }
  discover(id, (r) => {
    const hit = r.find((f) => f.id === id.toUpperCase());
    if (!hit) { done(false); return; }
    if (hit.ip !== p.wifi.ip || hit.port !== p.wifi.port) Object.assign(p.wifi, { ip: hit.ip, port: hit.port });
    done(true);
  });
}
function connect(p) {
  if (p.conn === 'ble' && !p.ble.mac) { snack('Hồ sơ chưa có MAC. Bấm Sửa để chọn xe BLE.'); return; }
  if (S.connectedId) disconnect();
  S.connectingId = p.id;
  locate(p, (found) => {
    S.connectedId = p.id; S.link = 'connecting'; render();
    setTimeout(() => {
      S.connectingId = null;
      if (!carReachable(p.conn, p.wifi.ip, p.wifi.port, p.ble.mac)) {
        S.connectedId = null; S.link = 'disconnected'; render();
        const err = 'Kết nối thất bại: xe không trả lời cấu hình';
        snack(found ? err : `${err}. Không thấy xe trong mạng: kiểm tra điện thoại và xe cùng router (không dùng mạng khách). Xe không vào được router thì sau 15 giây tự phát WiFi riêng.`);
        return;
      }
      S.link = document.getElementById('simLost').checked ? 'lost' : 'connected';
      S.gear = 1;
      p.lastConnectedAt = Date.now();
      S.arm.onConnected(); // CONNECTED "Đang đồng bộ…": chưa ARM được tới khi đồng bộ failsafe xong
      openControl(p.id);
      // Không có bước "đọc từ xe": hồ sơ trong app luôn được đưa xuống xe (E6); xong thì READY
      setTimeout(() => { if (S.connectedId === p.id && S.link !== 'disconnected') { syncProfile(p); render(); } }, 700);
    }, 900);
  });
}

// ============================================================================
//  Mạng của xe (network_screen.dart)

// Đọc và đổi cấu hình mạng lưu trên xe: chế độ khi bật nguồn (AP / Router), WiFi riêng, WiFi router (IP động/tĩnh),
// port UDP, tên thiết bị; vào chế độ cấu hình (WiFi tạm). Chỉ đọc/sửa được khi đang nối đúng xe của hồ sơ.
/** SettingsScreen._openNetwork: màn này sửa thẳng phần kết nối của hồ sơ đã lưu → quay về thì nạp lại vào bản nháp */
function openNetwork() {
  const pid = S.settings.pid, p = prof(pid);
  S.net = { pid, status: null, saved: null, cfg: null, busy: false, showAp: false, showSta: false, wifiBefore: JSON.stringify(p.wifi) };
  if (isConnected(p)) netLoad();
  go('network');
}
const netConnected = () => isConnected(prof(S.net.pid));
const netDirty = () => !!S.net.cfg && !!S.net.saved && JSON.stringify(S.net.cfg) !== JSON.stringify(S.net.saved);
function leaveNetwork() {
  const before = S.net.wifiBefore;
  S.net = null;
  back();
  const st = S.settings, fresh = st && prof(st.pid);
  if (!fresh || JSON.stringify(fresh.wifi) === before) return;
  const wasDirty = settingsDirty();
  st.draft.wifi = clone(fresh.wifi); st.portTxt = String(fresh.wifi.port);
  st.draft.ble.deviceName = fresh.ble.deviceName;
  if (!wasDirty) st.saved = draftJson(st.draft);
}
function netBack() {
  if (netDirty() && netConnected()) confirmDlg('Bỏ thay đổi?', 'Các thay đổi chưa lưu vào xe sẽ bị mất.', 'Bỏ', leaveNetwork);
  else leaveNetwork();
}
/** Sửa phần kết nối WiFi của hồ sơ đã lưu */
function patchProfile(pid, edit) { const p = prof(pid); if (p) edit(p.wifi, p); }
function netLoad() {
  const n = S.net;
  n.busy = true;

    if (S.net !== n) return;
    n.busy = false;
    if (!netConnected()) { render(); return; }
    n.status = carNetStatus(); n.saved = carNetConfig(); n.cfg = clone(n.saved);
    n.showAp = n.showSta = false;
    S.raw = {}; // ô nhập hiện lại giá trị vừa đọc từ xe

/** Hướng dẫn nối lại sau khi xe khởi động lại với cấu hình `cf` */

  return `Xe vào router "${cf.staSsid}". Nối điện thoại vào cùng router (băng 2.4 hay 5 GHz đều được) rồi bấm Kết nối, app tự tìm xe trong mạng${cf.staDhcp ? '' : ` (IP ${cf.staIp})`}.\n\n` +

/** Gửi lệnh: xe trả ACK rồi tự khởi động lại, app ngắt kết nối */
function netRun(send, after) {

// ============================================================================
//  Sửa một Input (input_screen.dart)

function openInput(src) {
  const d = S.settings.draft;
  if (!src && d.inputs.length >= MAX_INPUTS) { snack(`Tối đa ${MAX_INPUTS} Input`); return; }
  const base = src ?? newInput(uniqueInputId('input', d.inputs.map((i) => i.id)), `Input ${d.inputs.length + 1}`);
  S.inEdit = { orig: src ? src.id : null, x: clone(base), used: src ? rulesUsing(d, src.id).length : 0,
    taken: new Set(d.inputs.filter((i) => i.id !== base.id).map((i) => i.id)) };
  go('input');
}
function renderInput() {
  const e = S.inEdit, x = e.x, locked = e.used > 0;
  const id = x.id.trim();
  const err = inputError({ ...x, id }) || (e.taken.has(id) ? `Đã có Input khác mã "${id}"` : null);
  const pct = (label, v, set) => numField(label, Math.round(v), { min: -100, max: 100, step: 5, unit: '%' }, set);
  const cap = (t) => `<div class="caption" style="margin:16px 0 6px">${t}</div>`;
  const note = (t) => `<div class="muted" style="font-size:13px;font-weight:500;margin-top:8px">${esc(t)}</div>`;
  let h = field('Tên', x.name, { fid: 'iname', max: 24, on: (v) => { x.name = v; } }) + '<div style="height:8px"></div>' +
    field('Mã (dùng trong điều kiện)', x.id, { fid: 'iid', max: 24, disabled: locked, helper: locked ? `Đang được ${e.used} luật dùng nên không đổi được mã` : 'a–z, 0–9, "_"', on: (v) => { x.id = v; } }) +
    cap('KIỂU') + segs(Object.entries(IN_TYPE), x.type, (k) => { x.type = k; }, 'sm' + (locked ? ' dis' : '')) +
    (locked ? '<div class="muted" style="font-size:12px;font-weight:500;margin-top:4px">Kiểu bị khoá vì Input đang được luật dùng.</div>' : '');
  if (x.type === 'axis') {
    h += cap('DẢI GIÁ TRỊ') + segs(Object.entries(AXIS_RANGE), x.range, (k) => { x.range = k; }, 'sm') +
      note(x.range === 'unipolar' ? 'Cần ở thấp nhất = 0%, cao nhất = 100%. Muốn phủ cả Min…Max của kênh thì dùng nút "Toàn dải" trong luật mix.' : 'Cần ở giữa = 0%, hai đầu = −100% / +100%.');
  } else if (x.type === 'binary' || x.type === 'ternary') {
    const bin = x.type === 'binary';
    h += cap('GIÁ TRỊ ĐƯA VÀO MIXER') + pct(bin ? 'Khi tắt' : 'Nấc trái', x.levels.off, (v) => { x.levels.off = v; }) +
      (bin ? '' : pct('Nấc giữa', x.levels.mid, (v) => { x.levels.mid = v; })) +
      pct(bin ? 'Khi bật' : 'Nấc phải', x.levels.on, (v) => { x.levels.on = v; }) +
      note(`Điều kiện so theo trạng thái (${bin ? '0 = tắt, 1 = bật' : '−1 / 0 / 1'}), không phụ thuộc các giá trị % ở trên.`);
  } else h += '<div style="height:12px"></div>' + pct('Giá trị', x.constPct, (v) => { x.constPct = v; });
  if (err) h += `<div style="display:flex;gap:8px;align-items:center;color:var(--bad);font-size:14px;font-weight:500;margin-top:16px">${ic('warning', { mini: true })}${esc(err)}</div>`;
  const done = () => {
    const d = S.settings.draft;
    x.name = x.name.trim(); x.id = id;
    if (e.orig == null) d.inputs.push(x);
    else {
      renameInput(d, e.orig, x.id);
      d.inputs[d.inputs.findIndex((y) => y.id === x.id)] = x;
      // Kiểu mới không còn hợp với phần tử đang gắn → gỡ khỏi phần tử
      for (const it of d.layout.items) if (itemIns(it).includes(x.id) && !accepts(x, it.kind)) unbindInput(d.layout, x.id);
    }
    back();
  };
  return `<div class="appbar"><button class="iconbtn" data-act="${A(back)}">${ic('back')}</button><div class="title">${esc(x.name.trim() || 'Input')}</div></div>
    <div class="body" data-scroll="input">${h}<div style="height:16px"></div></div>
    <div class="bottombar" style="padding:12px"><button class="btn filled" style="width:100%" ${err ? 'disabled' : ''} data-act="${A(done)}">${ic('save', { mini: true })}Xong</button></div>`;
}

// ============================================================================
//  Trình dựng điều kiện (widgets/condition_builder.dart)
// ============================================================================
// Mỗi hàng `Input · toán tử · giá trị · (trễ)` hoặc một Condition đặt tên; nhóm Tất cả (AND) / Một trong (OR);
// mỗi hàng có thể Phủ định. Biểu thức lồng sâu hơn (từ file nhập) chỉ xem được.
function cbRowOf(e) {

  if (e.op === 'not') { neg = true; e = e.arg; }
  if (e.op === 'cmp') return { input: e.input, ref: null, op: e.cmp, value: e.value, hyst: e.hyst || 0, negate: neg };
  if (e.op === 'ref') return { input: null, ref: e.id, op: '==', value: 1, hyst: 0, negate: neg };
  return null;
}
function cbParse(e) {
  if (e.op === 'true') return { rows: [], group: null };
  if (e.op === 'and' || e.op === 'or') {
    const rows = e.args.map(cbRowOf);
    return rows.every(Boolean) ? { rows, group: e.op === 'or' ? 'any' : 'all' } : { complex: true };
  }

  return r ? { rows: [r], group: null } : { complex: true };
}
function cbBuild(rows, group) {

    return r.negate ? { op: 'not', arg: leaf } : leaf;
  });

}
/** Ô số gõ tay; giữ chữ đang gõ (vd "-") tới khi thành số hợp lệ */
function numText(label, fid, v, min, max, set) {
  return `<div class="field dense"><input data-in="${I((s) => { const t = s.trim().replace(',', '.'), x = t === '' ? NaN : Number(t); if (!isNaN(x)) set(clamp(x, min, max)); })}" data-fid="${fid}" inputmode="decimal" value="${esc(S.raw[fid] ?? fmtNum(v))}"><label>${esc(label)}</label></div>`;
}
function cbValue(r, d, fid, emit) {
  if (d.type === 'binary') return segs([[0, 'Tắt (0)'], [1, 'Bật (1)']], r.value === 0 ? 0 : 1, (v) => { r.value = v; emit(); }, 'sm');
  if (d.type === 'ternary') return segs([[-1, 'Trái'], [0, 'Giữa'], [1, 'Phải']], Math.round(clamp(r.value, -1, 1)), (v) => { r.value = v; emit(); }, 'sm');
  return numText(isUnipolar(d) ? 'Giá trị (0…100%)' : 'Giá trị (%)', fid + '-v', r.value, isUnipolar(d) ? 0 : -100, 100, (v) => { r.value = v; emit(); });
}
function cbRow(key, r, i, rows, p, emit) {

  const opts = [...p.inputs.filter((x) => x.type !== 'constant').map((x) => [x.id, x.name]), ...p.conditions.map((c) => [`ref:${c.id}`, `Điều kiện "${c.name}"`])];
  const pickSrc = (v) => {
    if (v.startsWith('ref:')) { r.ref = v.slice(4); r.input = null; }
    else {
      const d = findInput(p, v), was = isAxisIn(input);
      r.ref = null; r.input = v;
      if (isAxisIn(d) !== was) { r.op = isAxisIn(d) ? '>=' : '=='; r.value = isAxisIn(d) ? 50 : 1; r.hyst = 0; }
    }
    emit();

  const fid = `cb-${key}-${i}-${r.input ?? r.ref}`;
  let h = `<div class="cond"><div style="display:flex;align-items:center;gap:4px"><div style="flex:1;min-width:0">${selectField('Khi', r.ref != null ? `ref:${r.ref}` : r.input ?? '', opts, pickSrc, true)}</div>
    <button class="iconbtn" title="Xoá" style="color:var(--textMuted)" data-act="${A(() => { rows.splice(i, 1); emit(); })}">${ic('delete', { mini: true })}</button></div>`;
  if (r.ref == null && input) {
    h += `<div style="display:flex;align-items:center;gap:8px;margin-top:6px;padding-right:8px">
      <select class="selsm" data-sel="${I((o) => { r.op = o; if (!isOrdered(o)) r.hyst = 0; emit(); })}">${CMP_OPS.map((o) => `<option value="${esc(o)}" ${o === r.op ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>
      <div style="flex:1;min-width:0">${cbValue(r, input, fid, emit)}</div></div>`;
    if (isOrdered(r.op) && isAxisIn(input)) h += `<div style="margin-top:6px;padding-right:8px">${numText('Trễ (hysteresis)', fid + '-h', r.hyst, 0, 200, (v) => { r.hyst = v; emit(); })}</div>`;

    return `<div>${esc(describeExpr(expr, (id) => names[id] ?? id))}</div>
      <div class="muted" style="font-size:12px;font-weight:500;margin-top:4px">Điều kiện lồng nhiều tầng: chỉ xem được ở đây.</div>

  let h = !rows.length ? '<div class="lbl muted">Luôn đúng — luật luôn chạy.</div>'
    : rows.length > 1 ? segs([['all', 'Tất cả (AND)'], ['any', 'Một trong (OR)']], group, (g) => { group = S.cbGroup[key] = g; emit(); }, 'sm') : '';
  h += rows.map((r, i) => cbRow(key, r, i, rows, p, emit)).join('');
  const add = () => {
    const first = usable[0];
    rows.push({ input: first?.id ?? null, ref: first ? null : p.conditions[0]?.id ?? null, op: !first || isAxisIn(first) ? '>=' : '==', value: !first || isAxisIn(first) ? 50 : 1, hyst: 0, negate: false });
    emit();
  };
  const canAdd = rows.length < MAX_CMP && (usable.length || p.conditions.length);
  return h + `<button class="btn text small" style="margin:4px 0 0 -12px" ${canAdd ? '' : 'disabled'} data-act="${A(add)}">${ic('plus', { mini: true })}Thêm điều kiện</button>`;
}

const NEW_CONST = '+const';

        if (!k) { k = newInput(uniqueInputId(`k_${label.replace('-', 'm').replace('.', '_')}`, d.inputs.map((i) => i.id)), `Hằng ${label}%`, 'constant', { constPct: val }); d.inputs.push(k); }

  if (pv.sig !== sig) {

//  Màn Lái + Sửa bố cục (control_screen.dart, layout/*)
// ============================================================================
// Phần tử ghi vào Input; mixer quyết định kênh. Có ARM / DISARM (R1–R3).
const ctlProfile = () => S.ctl && prof(S.ctl.pid);
const ctlLayout = () => S.ctl && (S.ctl.editing ? S.ctl.draft : ctlProfile()?.layout);

function openControl(pid) {
  const p = prof(pid);
  S.ctl = { pid, editing: false, draft: null, sel: null, undo: [], redo: [], snap: null, pipe: null, armCond: null, errors: [] };
  if (S.gear > p.gears.count) S.gear = p.gears.count;
  loadPipe();
  initValues();
  go('control');
}
/** CarController.loadProfile: nạp (hoặc nạp lại sau khi sửa) hồ sơ vào vòng gửi; vị trí Input giữ nguyên */
function loadPipe() {
  const p = ctlProfile(), c = S.ctl;
  if (!c.pipe) c.pipe = new OutputPipeline(p); else c.pipe.update(p);
  S.arm.autoArm = p.arm.autoArm;
  c.armCond = p.arm.armCondition ? c.pipe.mixer.conditions.compile(p.arm.armCondition) : null;
  for (const [id, v] of Object.entries(S.pos)) c.pipe.inputs.setPosition(id, v);
  for (const [id, v] of Object.entries(S.swPos)) c.pipe.inputs.setSwitch(id, v);
  c.errors = validateAll(p);
}
/** Điều kiện ARM riêng của hồ sơ (R2) đang đúng */
function armConditionOk() {
  const c = S.ctl;
  return !c?.armCond || !c.pipe || c.pipe.mixer.conditions.eval(c.armCond, c.pipe.inputs.state);
}
/** _armCheck: điều kiện ARM do màn Lái cung cấp (điều kiện ARM riêng được xét khi hoàn tất giữ nút và mỗi chu kỳ) */
function armCheck() {
  const c = S.ctl, p = ctlProfile();
  return { profileValid: !c.errors.length, throttleAtRest: c.pipe ? c.pipe.throttleAtRest(p.layout) : true, editing: c.editing, armConditionOk: true };
}
/** Cần gạt / núm gắn Input `id`: vị trí −100…+100 */
function setPos(id, v) { const x = clamp(v, -100, 100); S.pos[id] = x; S.ctl?.pipe?.inputs.setPosition(id, x); }
/** Nút / công tắc gắn Input `id`: nấc 0/1 (bật/tắt) hoặc 0/1/2 (3 nấc) */
function setSw(id, pos) { S.swPos[id] = pos; S.ctl?.pipe?.inputs.setSwitch(id, pos); }
/** _initValues: vị trí ban đầu khi vào màn (H3b); nút nhấn giữ về tắt, nút bật/tắt và công tắc giữ trạng thái */
function initValues() {
  const p = ctlProfile();
  for (const it of p.layout.items) {
    if (it.input == null) continue;
    if (isStickK(it.kind)) {
      setPos(it.input, RM.initial(it.ret || newRet(), it.saved));
      if (it.kind === 'stick2D' && it.inputY != null) setPos(it.inputY, RM.initial(it.retY || newRet(), it.savedY));
    } else if (it.kind === 'button') setSw(it.input, 0);
  }
  stopAxes();
}
/** _resetSticks: thoát màn / vào sửa bố cục / app xuống nền → cần về vị trí thả; ga "Giữ vị trí" về Center */
function resetSticks(remember) {
  const p = ctlProfile();
  if (!p) return;
  for (const it of p.layout.items) {
    const axis = (id, cfg, save) => {
      if (id == null) return;
      const r = cfg || newRet();
      if (remember && r.mode === 'hold' && r.remember) save(S.pos[id] ?? 0);
      setPos(id, RM.onExit(r, isThrottleInput(p, id)));
    };
    if (isStickK(it.kind)) {
      axis(it.input, it.ret, (v) => { it.saved = v; });
      if (it.kind === 'stick2D') axis(it.inputY, it.retY, (v) => { it.savedY = v; });
    } else if (it.kind === 'button' && it.input != null) setSw(it.input, 0);
  }
  stopAxes();
}
function leaveControl() {
  if (S.screen !== 'control' || !S.ctl) return;
  if (S.ctl.editing) cancelEdit();
  resetSticks(true);
  S.arm.disarm('Thoát màn Lái');
}

function itemLabel(p, it) {
  if (!it.style.showLabel) return null;
  if (it.style.label && it.style.label.trim()) return it.style.label;
  if (it.kind === 'gauge') return GAUGES[it.gauge];
  return findInput(p, it.input)?.name ?? KIND[it.kind];
}
/** Giá trị trên phần tử: % của Input, hoặc µs của kênh nếu Input được gắn nhanh tới một kênh */
function valText(p, it, id) {
  if (it.style.valueDisplay === 'hidden') return null;
  const pct = S.ctl?.pipe ? S.ctl.pipe.inputs.valueOf(id) : S.pos[id] ?? 0;
  if (it.style.valueDisplay === 'pct') return `${Math.round(pct)}%`;
  const ch = quickRoute(p, id), out = S.ctl?.pipe?.lastPct;
  return ch == null || !out ? `${Math.round(pct)}%` : `${toUs(p.channels[ch - 1], out[ch - 1])} µs`;
}
function trailingText(p, it) {
  if (it.input == null) return null;
  if (it.kind === 'stick2D') {
    const xs = valText(p, it, it.input), ys = it.inputY == null ? null : valText(p, it, it.inputY);
    return xs == null ? null : `X ${xs}${ys == null ? '' : ' · Y ' + ys}`;
  }
  return valText(p, it, it.input);
}
function frame(label, trailing, inner, style = '') {
  return `<div class="frameitem" style="${style}">${label != null || trailing != null ? `<div class="hd"><span class="caption">${esc(label ?? '')}</span>${trailing != null ? `<span class="val">${trailing}</span>` : ''}</div>` : ''}<div class="ct">${inner}</div></div>`;
}
function gaugeData(key) {
  const t = S.tel;
  switch (key) {
    case 'battery': return [t ? 'batteryHalf' : 'batteryEmpty', t ? `${t.v.toFixed(2)} V` : '--', null];
    case 'current': return ['current', t ? `${t.a.toFixed(1)} A` : '--', null];
    case 'speed': return ['speedometer', t ? `${t.kmh.toFixed(1)} km/h` : '--', null];
    // Ping ngầm khi lái (F6) chưa làm — như app: tạm hiện RSSI ở dòng phụ
    case 'ping': return ['signal', '--', t && t.rssi ? `RSSI ${t.rssi} dBm` : null];
    case 'rssi': return [t && t.rssi ? 'signal' : 'signalOff', t && t.rssi ? `${t.rssi} dBm` : '--', null];
  }
}
/** Ô "Kênh đầu ra": 10 thanh nhỏ hiện % của CH1–CH10 sau mixer (U6) */
const monitorHtml = () => `<div class="mon" data-mon="1">${CHS.map((i) => `<div class="mb"><div class="mt"><div class="mf"></div></div><span>${i}</span></div>`).join('')}</div>`;
/** Cập nhật ô Kênh đầu ra và giá trị trên phần tử (µs lấy từ kết quả mixer) */
function updateLive() {
  if (S.screen !== 'control' || !S.ctl) return;
  const p = ctlProfile(), l = ctlLayout(), out = S.ctl.pipe?.lastPct;
  scr.querySelectorAll('[data-mon]').forEach((el) => el.querySelectorAll('.mf').forEach((f, i) => {
    const v = out ? out[i] / 100 : 0;
    Object.assign(f.style, { top: (v >= 0 ? 50 - 50 * v : 50) + '%', height: `max(1px, ${50 * Math.abs(v)}%)`, background: p.channels[i].enabled ? 'var(--accentFill)' : 'var(--disabled)' });
  }));
  scr.querySelectorAll('[data-vt]').forEach((el) => { const it = l.items.find((i) => i.id === el.dataset.vt); if (it) el.textContent = trailingText(p, it) ?? ''; });
}

// ---------- Trục cần gạt: vị trí thô, tự về (ReturnMotion), vùng chết ----------
const AXS = {};      // trạng thái bền: {raw, held, anim, kb}
let AXD = {};        // mô tả trục, dựng lại mỗi lần vẽ: {vertical, knob, dz, ret(), get(), set(out)}
const ax = (k) => (AXS[k] ||= { raw: 0, held: false, anim: null });
function regAxis(key, d) { AXD[key] = d; }
function inAxis(key, id, o) {
  regAxis(key, { ...o, get: () => id == null ? 0 : S.pos[id] ?? 0, set: (out) => { if (id != null) setPos(id, out); } });
}
function stopAxes() { for (const k in AXS) { AXS[k].held = false; AXS[k].anim = null; AXS[k].kb = false; } }
function setRaw(k, v) { const a = ax(k), d = AXD[k]; a.raw = clamp(v, -100, 100); if (d) d.set(RM.dz(a.raw, d.dz)); }
/** Không chạm và không đang tự về → đi theo giá trị bị đặt từ ngoài (thoát màn, failsafe…) */
function follow(k) {
  const a = ax(k), d = AXD[k];
  if (d && !a.held && !a.anim) { const g = d.get(); if (Math.abs(RM.dz(a.raw, d.dz) - g) > 0.01) a.raw = g; }
  return a;
}
let rafId = null;
function loop() { if (rafId == null) rafId = requestAnimationFrame(tick); }
function tick(now) {
  rafId = null;
  let any = false;
  for (const k in AXS) {
    const a = AXS[k];
    if (!a.anim) continue;
    if (!AXD[k]) { a.anim = null; continue; }
    const ms = now - a.anim.t0;
    setRaw(k, RM.valueAt(a.anim.cfg, a.anim.from, ms));
    if (ms >= RM.total(a.anim.cfg)) a.anim = null; else any = true;
  }
  drawAxes();
  if (any) loop();
}
function releaseAxis(k) {
  const a = ax(k), d = AXD[k];
  a.held = false;
  const cfg = d?.ret?.();
  if (cfg && returnsFrom(cfg, a.raw)) { a.anim = { cfg, from: a.raw, t0: performance.now() }; loop(); }
}

/** Input có luật có điều kiện hoặc đi vào nhiều kênh → chấm `accent`; nhấn giữ xem luật (U6) */
function isMixed(p, id) { const rs = rulesUsing(p, id); return rs.length > 1 || rs.some((r) => r.condition.op !== 'true'); }
function showRules(it) {
  const p = ctlProfile(), ids = itemIns(it), mixer = S.ctl.pipe?.mixer;
  const rules = [...new Set(ids.flatMap((id) => rulesUsing(p, id)))];
  S.overlay = { type: 'html', html: () => `<h3>${esc(ids.map((i) => findInput(p, i)?.name ?? i).join(' · '))}</h3>
    ${rules.length ? `<div class="dlist">${rules.map((r) => {
      const pend = mixer?.isPending(r.id), act = mixer?.isActive(r.id);
      return `<div style="display:flex;gap:12px;padding:6px 0"><span style="margin-top:6px;width:10px;height:10px;border-radius:50%;flex:none;background:${pend ? 'var(--warn)' : act ? 'var(--accent)' : 'var(--disabled)'}"></span>
        <div><div style="font-size:14px">${esc(describeRule(r, p))}</div><div class="muted" style="font-size:12px;font-weight:500">${pend ? 'Chờ về giữa' : act ? 'Đang tác động' : 'Không tác động'}</div></div></div>`;
    }).join('')}</div>` : '<p>Input này chưa đi vào kênh nào.</p>'}
    <div class="acts"><button class="btn text" data-act="${A(closeOverlay)}">Đóng</button></div>` };
  render();
}
function renderItem(p, it) {
  const lbl = itemLabel(p, it), id = it.input;
  if (isControl(it.kind) && (id == null || !findInput(p, id))) return frame(KIND[it.kind], null, '<div class="lbl muted" style="text-align:center;padding-top:8px">Chưa gắn Input</div>');
  const knob = KNOB[it.style.knobSize][1], tr = trailingText(p, it);
  const trail = tr == null ? null : `<span data-vt="${it.id}">${esc(tr)}</span>`;
  const iconName = PICK_ICONS[it.style.icon];
  switch (it.kind) {
    case 'stickH': case 'stickV': {
      const key = it.id + ':x';
      inAxis(key, id, { vertical: it.kind === 'stickV', knob, dz: it.style.deadzone, ret: () => it.ret });
      return frame(lbl, trail, `<div class="axis" data-axis="${key}"><div class="cl"></div><div class="bar"></div><div class="th"></div></div>`);
    }
    case 'stick2D': {
      inAxis(it.id + ':x', id, { knob, dz: it.style.deadzone, ret: () => it.ret });
      inAxis(it.id + ':y', it.inputY, { knob, dz: it.style.deadzone, ret: () => it.retY });
      return frame(lbl, trail, `<div class="s2" data-s2="${it.id}"><div class="b2"></div><div class="h2"></div><div class="v2"></div><div class="k2"></div></div>`);
    }
    case 'button': case 'toggle': {
      const on = (S.swPos[id] ?? 0) === 1;
      const toggle = it.kind === 'toggle' ? `data-act="${A(() => setSw(id, on ? 0 : 1))}"` : '';
      return `<div class="chbtn${on ? ' on' : ''}" data-chbtn="${it.id}" ${toggle}>${iconName ? ic(iconName, { solid: on }) : ''}${lbl ? `<span class="lbl">${esc(lbl)}</span>` : ''}${it.kind === 'toggle' ? `<span class="caption">${on ? 'BẬT' : 'TẮT'}</span>` : ''}</div>`;
    }
    case 'switch3': {
      const pos = S.swPos[id] ?? 1; // chưa đụng tới: nấc giữa (trạng thái nghỉ — I3)
      const sw = `<div class="sw3">${['◀', '●', '▶'].map((m, i) => `<button class="${pos === i ? 'on' : ''}" data-act="${A(() => { if (i !== pos) setSw(id, i); })}">${m}</button>`).join('')}</div>`;
      return frame(lbl, null, `<div style="display:flex;align-items:center;gap:4px;height:100%">${iconName ? `<span style="color:var(--textMuted)">${ic(iconName, { mini: true })}</span>` : ''}<div style="flex:1;height:100%;display:flex;align-items:center">${sw}</div></div>`);
    }
    case 'knob': {
      inAxis(it.id + ':k', id, { dz: it.style.deadzone });
      return frame(lbl, trail, `<div class="knob" data-knob="${it.id}"></div>`);
    }
    case 'gauge': {
      const glabel = it.style.showLabel ? (it.style.label ?? GAUGES[it.gauge]) : '';
      if (it.gauge === 'channels') return frame(glabel || null, null, monitorHtml(), 'padding:4px 4px 2px');
      const [icon, v, sub] = gaugeData(it.gauge);
      return `<div class="gauge" data-gauge="${it.id}"><div class="gh">${ic(icon)}<span class="caption">${esc(glabel.toUpperCase())}</span></div><div class="gv">${v}</div><div class="gs">${sub ?? ''}</div></div>`;
    }
    case 'gearBox': {
      const g = clamp(S.gear, 1, p.gears.count);
      return frame(lbl, null, `<div class="rowctl"><button class="iconbtn outlined" ${S.gear > 1 ? '' : 'disabled'} data-act="${A(() => { S.gear--; })}">${ic('minus')}</button>
        <div class="mid"><div style="font-size:26px;font-weight:800;line-height:1.1">Số ${g}</div><div class="muted" style="font-size:12px;font-weight:500">Ga tối đa ${p.gears.max[g - 1]}%</div></div>
        <button class="iconbtn outlined" ${S.gear < p.gears.count ? '' : 'disabled'} data-act="${A(() => { S.gear++; })}">${ic('plus')}</button></div>`, 'padding:4px');
    }
    case 'trim': {
      const s = p.channels[0];
      const trim = (d) => {
        const nv = clamp(s.trim + d, -200, 200);
        if (nv === s.trim) return;
        s.trim = nv;
        if (isConnected(p)) S.carCfg[p.id] = carConfigOf(p);
      };
      return frame(lbl, null, `<div class="rowctl"><button class="btn outlined small" data-act="${A(() => trim(-5))}">◀</button>
        <div class="mid" style="font-size:18px;font-weight:700;white-space:nowrap">Trim ${s.trim} µs</div>
        <button class="btn outlined small" data-act="${A(() => trim(5))}">▶</button></div>`, 'padding:4px');
    }
    case 'statusBadge':
      return `<div style="height:100%;display:flex;align-items:center;justify-content:center">${statusPill(S.connectedId === p.id ? S.link : 'disconnected')}</div>`;
  }
  return '';
}

// ---------- Nút ARM / DISARM: nhấn giữ 1 s để ARM (có vòng tiến trình), bấm một lần để DISARM ----------
let armHold = null;
const armRing = (t) => `<svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="8" fill="none" stroke="var(--line)" stroke-width="2.5"/>
  <circle cx="10" cy="10" r="8" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="${(t * 50.27).toFixed(2)} 60" transform="rotate(-90 10 10)"/></svg>`;
function armButton() {
  const a = S.arm, armed = a.armed, ready = a.state === 'ready';
  return `<div class="armbtn${armed ? ' armed' : ready ? ' ready' : ''}" id="armBtn" data-arm="1" style="color:${armed ? 'var(--onAccentFill)' : ready ? 'var(--text)' : 'var(--disabled)'}">
    <span class="armic">${ic(armed ? 'unlocked' : 'locked', { mini: true })}</span>${armed ? 'ARMED' : ready ? 'Giữ để ARM' : ARM_LABEL[a.state]}</div>`;
}
function armStart() {
  const err = S.arm.canArm(armCheck());
  if (err) { snack(err); return false; }
  armHold = { t0: performance.now() };
  const step = (now) => {
    if (!armHold) return;
    const t = (now - armHold.t0) / 1000;
    if (t >= 1) {
      armHold = null;
      const e = S.arm.arm({ ...armCheck(), armConditionOk: armConditionOk() });
      if (e) snack(e);
      render();
      return;
    }
    const el = document.querySelector('#armBtn .armic');
    if (el) el.innerHTML = armRing(t);
    requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
  return true;
}
function armCancel() { if (armHold) { armHold = null; render(); } }

function driveMenu(ev) {
  const l = ctlProfile().layout;
  const settings = (tab) => () => { S.arm.disarm('Mở Cấu hình'); openSettings(S.ctl.pid, tab); };
  openMenu(ev, [
    { icon: 'settings', label: 'Cấu hình', run: settings(0) },
    { icon: 'mix', label: 'Luật mix', run: settings(MIX_TAB) },
    { icon: 'edit', label: 'Sửa bố cục', sub: l.locked ? 'Đang khoá' : null, disabled: l.locked, run: startEdit },
    { icon: l.locked ? 'locked' : 'unlocked', label: l.locked ? 'Mở khoá bố cục' : 'Khoá bố cục', run: () => { l.locked = !l.locked; snack(l.locked ? 'Đã khoá bố cục' : 'Đã mở khoá bố cục'); } },
  ]);
}
function startEdit() {
  const p = ctlProfile(), c = S.ctl;
  if (p.layout.locked) { snack('Bố cục đang khoá. Mở khoá trong menu trước.'); return; }
  // Ga phải ở vị trí nghỉ (vị trí về đã cài, vd −28%), không bắt buộc đúng 0% (H5-1)
  if (c.pipe && !c.pipe.throttleAtRest(p.layout)) { snack('Thả cần ga trước khi sửa bố cục'); return; }
  resetSticks(false);
  S.arm.disarm('Đang sửa bố cục'); // chưa ARM → không gửi lệnh lái suốt thời gian sửa (H5, R3)
  Object.assign(c, { editing: true, draft: clone(p.layout), snap: JSON.stringify(p), sel: null, undo: [], redo: [] });
}
function endEdit() { Object.assign(S.ctl, { editing: false, draft: null, sel: null, snap: null }); loadPipe(); initValues(); }
/** Huỷ: bỏ mọi thay đổi từ lúc vào chế độ sửa, kể cả Input / luật tạo từ bảng thuộc tính */
function cancelEdit() {
  const c = S.ctl;
  if (c.snap) S.profiles[S.profiles.findIndex((x) => x.id === c.pid)] = JSON.parse(c.snap);
  endEdit();
}
function saveEdit() {
  const p = ctlProfile(), d = S.ctl.draft;
  const err = layoutValidate(d, driversOf(p, 2), driversOf(p, 1));
  if (err) { snack(err); return; }
  const commit = () => { p.layout = S.ctl.draft; endEdit(); snack('Đã lưu bố cục'); };
  // Cảnh báo cần ga "Giữ vị trí" hoặc về chậm > 500 ms (H3b)
  const risky = d.items.some((it) => (isThrottleInput(p, it.input) && it.ret && retRisky(it.ret)) || (isThrottleInput(p, it.inputY) && it.retY && retRisky(it.retY)));
  if (risky) confirmDlg('Cần ga không tự về ngay', 'Xe có thể tiếp tục chạy sau khi thả tay. Vẫn lưu bố cục?', 'Vẫn lưu', commit);
  else commit();
}
/** LayoutHistory: tối đa 30 bước */
function pushUndo() { const c = S.ctl; c.undo.push(clone(c.draft)); if (c.undo.length > 30) c.undo.shift(); c.redo = []; }
function addSheet() {
  const d = S.ctl.draft;
  const pick = (fn) => { pushUndo(); const it = fn(); S.overlay = null; if (it) S.ctl.sel = it.id; else snack('Không còn chỗ trống đủ lớn trên màn'); };
  const hintOf = { stickH: '−100…+100%, tự về khi thả (chỉnh được)', stickV: '−100…+100%, tự về khi thả (chỉnh được)', stick2D: 'Hai Input X/Y',
    button: 'Bật khi giữ, thả ra là tắt', toggle: 'Mỗi lần bấm đổi trạng thái', switch3: 'Trái / giữa / phải', knob: 'Giữ nguyên vị trí' };
  S.overlay = { type: 'sheet', html: () => {
    const controls = Object.keys(KIND).filter(isControl);
    const gauges = Object.keys(GAUGES).filter((g) => !d.items.some((i) => i.gauge === g));
    const extras = ['gearBox', 'trim', 'statusBadge'].filter((k) => !d.items.some((i) => i.kind === k));
    return `<div class="handle"></div><div class="h-title" style="margin-bottom:8px">Thêm điều khiển</div>

  Object.assign(hl.style, { left: cx - r * .8 + 'px', top: cy - .75 + 'px', width: r * 1.6 + 'px', height: '1.5px' });

  const nav = [['garage', 'Xe của tôi'], ['wizard', 'Tạo xe mới'], ['control', 'Màn Lái'], ['settings', 'Cấu hình']];
  const cur = ['channel', 'input', 'mix', 'network'].includes(S.screen) ? 'settings' : S.screen;
  document.getElementById('nav').innerHTML = nav.map(([k, l]) => `<button class="tb${cur === k ? ' on' : ''}" data-nav="${k}">${l}</button>`).join('');
  document.getElementById('themeBtn').textContent = effectiveTheme() === 'dark' ? '☾ Tối' : '☀ Sáng';
}
function fit() {
  const stage = document.getElementById('stage'), frame = document.getElementById('frame');
  frame.style.transform = 'none';
  const s = Math.min(1, (stage.clientWidth - 24) / frame.offsetWidth, (stage.clientHeight - 24) / frame.offsetHeight);
  frame.style.transform = `scale(${s})`;
}

// ============================================================================
//  Sự kiện
// ============================================================================
document.getElementById('nav').addEventListener('click', (e) => {
  const k = e.target.dataset.nav;
  if (!k) return;
  const p0 = S.profiles[0];
  if ((k === 'control' || k === 'settings') && !p0) { snack('Chưa có xe nào — tạo xe trước'); return; }
  leaveControl();
  S.history = []; S.overlay = null; S.screen = 'garage';
  const pid = S.connectedId && prof(S.connectedId) ? S.connectedId : p0?.id;
  if (k === 'wizard') openWizard();
  else if (k === 'control') openControl(pid);
  else if (k === 'settings') openSettings(pid);
  else render();
});
document.getElementById('themeBtn').onclick = () => { S.theme = effectiveTheme() === 'dark' ? 'light' : 'dark'; render(); };
document.getElementById('simFail').onchange = render;
document.getElementById('simEmpty').onchange = render;
document.getElementById('simLost').onchange = (e) => {
  if (S.connectedId && (S.link === 'connected' || S.link === 'lost')) S.link = e.target.checked ? 'lost' : 'connected';
  if (e.target.checked) S.arm.disarm('Mất tín hiệu');
  render();
};
document.getElementById('migBtn').onclick = () => {
  leaveControl();
  S.history = []; S.screen = 'garage';
  migrationReport();
  render();
};
window.addEventListener('resize', () => { fit(); drawAxes(); });

// Nhấn giữ nút −/+ (đổi gấp 10 lần)
let lpTimer = null, lpFired = false;

scr.addEventListener('click', (e) => {
  if (lpFired) { lpFired = false; return; }
  const m = e.target.closest('[data-menu]');
  if (m) { const fn = actions[m.dataset.menu]; if (fn) fn({ currentTarget: m }); return; }
  const stop = e.target.closest('[data-stop]');
  const a = stop ? (stop.dataset.act ? stop : null) : e.target.closest('[data-act]');
  if (!a || a.disabled) return;
  const fn = actions[a.dataset.act];
  if (fn) { fn(e); render(); }
});
scr.addEventListener('input', (e) => {
  const el = e.target;
  if (el.dataset.rg) {
    const r = RG[el.dataset.rg];
    if (!r) return;
    if (!r.started) { r.started = true; r.start?.(); }
    const v = +el.value;
    r.set(v);
    if (r.label) { const l = scr.querySelector(`[data-rgl="${el.dataset.rg}"]`); if (l) l.textContent = r.label(v); }
    r.after?.(v);
    return;
  }
  if (el.dataset.in) {
    const fn = INP[el.dataset.in];
    if (!fn) return;
    const fid = el.dataset.fid, pos = el.selectionStart;
    if (fid) S.raw[fid] = el.value;
    fn(el.value);
    render();
    const again = scr.querySelector(`[data-fid="${fid}"]`);
    if (again) { again.focus(); try { again.setSelectionRange(pos, pos); } catch (_) {} }
  }
});
scr.addEventListener('change', (e) => {
  const el = e.target;
  if (el.dataset.rg) {
    if (S.screen === 'channel') S.chEdit.preview = 0; // thả tay → thanh xem trước về 0
    render();
    return;
  }
  if (el.dataset.sel) { const fn = INP[el.dataset.sel]; if (fn) { fn(el.value); render(); } }
});
scr.addEventListener('dblclick', (e) => {
  const k = e.target.closest('[data-knob]');
  if (k && !S.ctl?.editing) { setRaw(k.dataset.knob + ':k', 0); drawAxes(); }
});

// Chạm: cần gạt, núm, nút giữ, nút ARM, nhấn giữ xem luật, kéo/đổi cỡ khi sửa bố cục, kéo đổi thứ tự luật mix. Hỗ trợ nhiều ngón.
const drags = new Map();
let mixLp = null; // nhấn giữ phần tử có chấm mix → xem luật (U6)
scr.addEventListener('pointerdown', (e) => {
  lpFired = false;
  const lp = e.target.closest('[data-lp]');
  if (lp && !lp.disabled) {
    clearTimeout(lpTimer);
    const k = lp.dataset.lp;
    lpTimer = setTimeout(() => { lpFired = true; actions[k]?.(); render(); }, 500);
  }
  if (S.overlay) return;
  const ro = e.target.closest('[data-reorder]');
  if (ro) {
    const [group, from] = ro.dataset.reorder.split(':').map(Number);
    drags.set(e.pointerId, { mode: 'reorder', group, from, to: null });
    e.preventDefault();
    return;
  }
  if (e.target.closest('[data-arm]')) {
    if (S.arm.armed) drags.set(e.pointerId, { mode: 'disarm' });
    else if (armStart()) drags.set(e.pointerId, { mode: 'armhold' });
    e.preventDefault();
    return;
  }
  const editing = S.screen === 'control' && S.ctl?.editing;
  const mixEl = !editing && e.target.closest('[data-mixitem]');
  if (mixEl) {
    clearTimeout(mixLp?.timer);
    const pid = e.pointerId, id = mixEl.dataset.item;
    mixLp = { pid, x: e.clientX, y: e.clientY, timer: setTimeout(() => {
      mixLp = null; lpFired = true; // nhấn giữ thắng chạm: không đổi trạng thái nút bật/tắt
      endPointer({ pointerId: pid });
      const it = ctlLayout()?.items.find((i) => i.id === id);
      if (it) showRules(it);
    }, 500) };
  }
  const axEl = e.target.closest('[data-axis]');
  if (axEl && !(editing && axEl.closest('#canvas'))) {
    const key = axEl.dataset.axis, a = ax(key);
    a.held = true; a.anim = null;
    const d = { mode: 'axis', key };
    drags.set(e.pointerId, d);
    moveAxis(e, d);
    e.preventDefault();
    return;
  }
  if (S.screen !== 'control' || !S.ctl) return;
  const c = S.ctl;
  if (editing) {
    if (!e.target.closest('#canvas')) return;
    const rz = e.target.closest('[data-rz]'), itEl = e.target.closest('[data-item]');
    if (!itEl) { c.sel = null; render(); return; }
    const it = c.draft.items.find((i) => i.id === itEl.dataset.item);
    // Chọn phần tử làm hiện bảng thuộc tính → canvas hẹp lại, nên đo sau khi vẽ lại
    if (c.sel !== it.id) { c.sel = it.id; render(); }
    const cv = document.getElementById('canvas'), r = cv.getBoundingClientRect();
    const scale = r.width / cv.offsetWidth;
    drags.set(e.pointerId, { mode: rz ? 'resize' : 'move', it, start: { ...it }, sx: e.clientX, sy: e.clientY, cw: r.width / COLS, ch: r.height / ROWS, scale, pushed: false });
    e.preventDefault();
    return;
  }
  const s2 = e.target.closest('[data-s2]');
  if (s2) {
    const id = s2.dataset.s2;
    for (const k of [id + ':x', id + ':y']) { const a = ax(k); a.held = true; a.anim = null; }
    const d = { mode: 's2', id };
    drags.set(e.pointerId, d);
    moveS2(e, d);
    e.preventDefault();
    return;
  }
  const kn = e.target.closest('[data-knob]');
  if (kn) {
    const key = kn.dataset.knob + ':k', r = kn.getBoundingClientRect();
    ax(key).held = true;
    drags.set(e.pointerId, { mode: 'knob', key, y0: e.clientY, raw0: follow(key).raw, side: Math.min(r.width, r.height) || 1 });
    e.preventDefault();
    return;
  }
  const btn = e.target.closest('[data-chbtn]');
  if (btn) {
    const it = ctlLayout().items.find((i) => i.id === btn.dataset.chbtn);
    if (it?.kind === 'button') {
      setSw(it.input, 1);
      drags.set(e.pointerId, { mode: 'button', id: it.input });
      render();
    }
  }
});
function moveAxis(e, d) {
  const el = scr.querySelector(`[data-axis="${d.key}"]`), desc = AXD[d.key];
  if (!el || !desc) return;
  const r = el.getBoundingClientRect();
  const v = desc.vertical ? (1 - (e.clientY - r.top) / r.height * 2) * 100 : ((e.clientX - r.left) / r.width * 2 - 1) * 100;
  setRaw(d.key, v);
  drawAxes();
}
function moveS2(e, d) {
  const el = scr.querySelector(`[data-s2="${d.id}"]`);
  if (!el) return;
  const r = el.getBoundingClientRect(), half = Math.min(r.width, r.height) / 2;
  setRaw(d.id + ':x', (e.clientX - (r.left + r.width / 2)) / half * 100);
  setRaw(d.id + ':y', -(e.clientY - (r.top + r.height / 2)) / half * 100);
  drawAxes();
}
window.addEventListener('pointermove', (e) => {
  if (mixLp && mixLp.pid === e.pointerId && Math.hypot(e.clientX - mixLp.x, e.clientY - mixLp.y) > 8) { clearTimeout(mixLp.timer); mixLp = null; }
  const d = drags.get(e.pointerId);
  if (!d) return;
  if (d.mode === 'axis') { moveAxis(e, d); return; }
  if (d.mode === 's2') { moveS2(e, d); return; }
  if (d.mode === 'knob') { setRaw(d.key, d.raw0 - (e.clientY - d.y0) / d.side * 200); drawAxes(); return; }
  if (d.mode === 'reorder') {
    const cards = [...scr.querySelectorAll(`[data-mg="${d.group}"]`)];
    let to = cards.length;
    for (const [i, el] of cards.entries()) { const r = el.getBoundingClientRect(); if (e.clientY < r.top + r.height / 2) { to = i; break; } }
    d.to = to;
    cards.forEach((el, i) => el.classList.toggle('dropto', i === to && to !== d.from && to !== d.from + 1));
    return;
  }
  if (d.mode !== 'move' && d.mode !== 'resize') return;
  const c = S.ctl, it = d.it, s = d.start;
  const dx = Math.round((e.clientX - d.sx) / d.cw), dy = Math.round((e.clientY - d.sy) / d.ch);
  let r;
  if (d.mode === 'move') r = { x: clamp(s.x + dx, 0, COLS - s.w), y: clamp(s.y + dy, 0, ROWS - s.h), w: s.w, h: s.h };
  else {
    const [mnW, mnH, mxW, mxH] = limitsFor(it.kind, d.cw / d.scale, d.ch / d.scale, touchable(it));
    r = { x: s.x, y: s.y, w: clamp(s.w + dx, mnW, Math.min(mxW, COLS - s.x)), h: clamp(s.h + dy, mnH, Math.min(mxH, ROWS - s.y)) };
  }
  if ((r.x !== it.x || r.y !== it.y || r.w !== it.w || r.h !== it.h) && fits(c.draft, r, it.id)) {
    if (!d.pushed) { const snap = clone(c.draft); Object.assign(snap.items.find((i) => i.id === it.id), { x: s.x, y: s.y, w: s.w, h: s.h }); c.undo.push(snap); if (c.undo.length > 30) c.undo.shift(); c.redo = []; d.pushed = true; }
    Object.assign(it, r);
    const el = scr.querySelector(`[data-item="${it.id}"]`);
    if (el) Object.assign(el.style, { left: it.x / COLS * 100 + '%', top: it.y / ROWS * 100 + '%', width: it.w / COLS * 100 + '%', height: it.h / ROWS * 100 + '%' });
    drawAxes();
  }
  drawGuides(c.draft, it.id, it, d.cw / d.scale, d.ch / d.scale);
  if (d.mode === 'move') {
    const trash = document.getElementById('trash');
    const tr = trash.getBoundingClientRect();
    d.over = e.clientX >= tr.left && e.clientX <= tr.right && e.clientY >= tr.top - 8 && e.clientY <= tr.bottom + 8;
    trash.classList.add('hot'); trash.classList.toggle('over', d.over);
    document.getElementById('trashTxt').textContent = 'Thả vào đây để xoá';
  }
});
function endPointer(e) {
  clearTimeout(lpTimer);
  if (mixLp && mixLp.pid === e.pointerId) { clearTimeout(mixLp.timer); mixLp = null; }
  const d = drags.get(e.pointerId);
  if (!d) return;
  drags.delete(e.pointerId);
  if (d.mode === 'axis') { releaseAxis(d.key); drawAxes(); }
  else if (d.mode === 's2') { releaseAxis(d.id + ':x'); releaseAxis(d.id + ':y'); drawAxes(); }
  else if (d.mode === 'knob') { ax(d.key).held = false; }
  else if (d.mode === 'button') { setSw(d.id, 0); render(); }
  else if (d.mode === 'disarm') { S.arm.disarm(); render(); }
  else if (d.mode === 'armhold') armCancel();
  else if (d.mode === 'reorder') {
    const dr = S.settings?.draft;
    if (dr && d.to != null && d.to !== d.from && d.to !== d.from + 1) reorderInGroup(dr, d.group, d.from, d.to > d.from ? d.to - 1 : d.to);
    render();
  } else if (d.mode === 'move' || d.mode === 'resize') {
    if (d.over) {
      if (!d.pushed) pushUndo();
      S.ctl.draft.items = S.ctl.draft.items.filter((i) => i.id !== d.it.id);
      S.ctl.sel = null;
    }
    render();
  }
}
window.addEventListener('pointerup', endPointer);
window.addEventListener('pointercancel', endPointer);

// Bàn phím: W/S ga (CH2), A/D lái (CH1) — như ngón tay giữ cần gắn Input đang điều khiển kênh đó, thả phím thì tự về
const keys = new Set();
function axisKeyFor(ch) {
  const l = ctlLayout();
  for (const id of driversOf(ctlProfile(), ch)) {
    const it = itemForInput(l, id);
    if (!it) continue;
    if (it.kind === 'stickH' || it.kind === 'stickV') return it.id + ':x';
    if (it.kind === 'stick2D') return it.id + (it.input === id ? ':x' : ':y');
  }
  return null;
}
function applyKeys() {
  if (S.screen !== 'control' || !S.ctl || S.ctl.editing) return;
  const dirs = { 1: (keys.has('d') ? 1 : 0) - (keys.has('a') ? 1 : 0), 2: (keys.has('w') ? 1 : 0) - (keys.has('s') ? 1 : 0) };
  for (const ch of [1, 2]) {
    const k = axisKeyFor(ch);
    if (!k || !AXD[k]) continue;
    const a = ax(k);
    if (dirs[ch]) { a.held = true; a.kb = true; a.anim = null; setRaw(k, dirs[ch] * 100); }
    else if (a.kb) { a.kb = false; releaseAxis(k); }
  }
  drawAxes();
}
window.addEventListener('keydown', (e) => {
  if (['INPUT', 'SELECT'].includes(e.target.tagName) || e.repeat) return;
  keys.add(e.key.toLowerCase()); applyKeys();
});
window.addEventListener('keyup', (e) => { keys.delete(e.key.toLowerCase()); applyKeys(); });

// Telemetry giả lập khi đang kết nối
let battery = 8.2;
setInterval(() => {
  if (S.screen !== 'control' || !S.ctl) return;
  const p = ctlProfile();
  if (!p) return;
  // Chế độ cấu hình: xe bỏ qua lệnh lái (nên failsafe), telemetry có cờ NET_SETUP
  const netSetup = CAR.mode === 'setup', failsafe = document.getElementById('simFail').checked || netSetup;
  if (S.connectedId !== p.id || S.link !== 'connected') { if (S.connectedId !== p.id) S.tel = null; updateGauges(); return; }
  if (failsafe && S.arm.armed) S.arm.onCarFailsafe();
  const wasFail = !!S.tel?.failsafe;
  const lim = p.gears.max[clamp(S.gear, 1, p.gears.count) - 1] / 100;
  // Giao thức v1: chỉ khi ARMED mới gửi CH2 sau mixer; hộp số áp sau mixer
  const thr = failsafe || !S.arm.armed || !S.ctl.pipe ? 0 : S.ctl.pipe.lastPct[1] / 100 * lim;
  battery = Math.max(6.4, battery - 0.0004 - Math.abs(thr) * 0.002);
  S.tel = { failsafe, netSetup, v: battery - Math.abs(thr) * 0.35, a: 0.4 + Math.abs(thr) * 18 + Math.random() * 0.3, kmh: Math.abs(thr) * 42 + (thr ? Math.random() : 0), rssi: -55 - Math.round(Math.random() * 6) };
  if (wasFail !== failsafe) render(); else updateGauges();
}, 200);

// Mở thẳng một màn: ui_preview.html#control | #settings | #wizard | #network | #light | #connected
render();
const hash = location.hash.slice(1).split(',');
if (hash.includes('light')) { S.theme = 'light'; render(); }
if (hash.includes('connected')) { const p = S.profiles[0]; S.connectedId = p.id; S.link = 'connected'; S.arm.onConnected(); syncProfile(p); }
const startNav = hash.find((h) => ['control', 'settings', 'wizard'].includes(h));
if (startNav) document.querySelector(`[data-nav="${startNav}"]`).click();
if (hash.includes('network') && S.profiles.length) { leaveControl(); S.history = []; S.screen = 'garage'; openSettings(S.profiles[0].id, SET_TABS.length - 1); openNetwork(); }
</script>
